<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1係 KPIダッシュボード</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    color-scheme: dark;
    /* ── 2026-09リブランディング準拠のトークン ──
       Shikigaku_template_v2.pptx のテーマカラーをそのまま使う：
       dk2 #101D32(紺) / lt2 #E6EAE3(地) / accent1 #649A5B(緑) / accent2 #0054A7(青)
       accent3 #E60020(赤) / accent4 #FFC800(黄) / accent5 #413893(紫) / accent6 #64C0AB(青緑)
       hlink #7ECEF4(明青)。書体も游ゴシックに合わせる */
    --brand-navy: #101D32;
    --bg: #080f1c;
    --card: #101D32;
    --card-2: #16253c;
    --card-3: #1c2f4a;
    --border: rgba(126,206,244,.14);
    --border-2: rgba(126,206,244,.28);
    --text: #E6EAE3;
    --muted: #93a8c0;
    --muted-2: #61758d;
    --accent: #64C0AB;
    --accent-dark: #3d9c88;
    --accent-tint: rgba(100,192,171,.14);
    --accent-glow: rgba(100,192,171,.45);
    --accent-2: #7ECEF4;
    --accent-3: #413893;
    --good: #649A5B;       --good-tint: rgba(100,154,91,.16);      --good-border: rgba(100,154,91,.4);
    --warning: #FFC800;    --warning-tint: rgba(255,200,0,.14);    --warning-border: rgba(255,200,0,.36);
    --critical: #E60020;   --critical-tint: rgba(230,0,32,.14);    --critical-border: rgba(230,0,32,.36);
    --track: rgba(126,206,244,.10);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 16px 32px -12px rgba(0,0,0,.55);
    --shadow-glass: 0 1px 0 0 rgba(230,234,227,.08) inset,
                    0 10px 24px 0 rgba(0,0,0,.4);
    --shadow-glass-hover: 0 1px 0 0 rgba(230,234,227,.14) inset,
                          0 14px 30px -6px rgba(0,0,0,.5);
    --radius: 10px;
    --body-font: "Yu Gothic", "游ゴシック", "Hiragino Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --display-font: "Yu Gothic", "游ゴシック", "Hiragino Sans", -apple-system, sans-serif;
    --sidebar-w: 208px;
  }
  * { box-sizing: border-box; }
  /* 画面全体を1ビューポートに固定する。ページ自体はスクロールさせない（各カード内で必要に応じてスクロール） */
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font-family: var(--body-font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 13px;
  }
  ::selection { background: var(--accent-tint); }

  /* 背景の光の膨らみ（.bg-glow）は、1画面完結のグリッドに切り替えた際に要素ごと削除した */

  /* ══ アプリシェル：左サイドバー＋1ビューポートに収まるメイングリッド ══ */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; position: relative; z-index: 1; }

  .sidebar {
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 14px;
    overflow: hidden;
  }
  .brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 6px;
    flex: 0 0 auto; display: block;
  }
  .brand-name { font-size: 12.5px; font-weight: 700; letter-spacing: .02em; line-height: 1.25; }
  .brand-sub { font-size: 9.5px; color: var(--muted-2); letter-spacing: .06em; }

  .side-clock { flex: 0 0 auto; }
  .side-clock .t { font-size: 21px; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; color: var(--accent-2); }
  .side-clock .d { font-size: 10px; color: var(--muted-2); letter-spacing: .04em; }

  .side-group { flex: 0 0 auto; }
  .side-label { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; color: var(--muted-2); margin-bottom: 6px; }
  .side-list { display: flex; flex-direction: column; gap: 2px; }

  .side-foot { margin-top: auto; flex: 0 0 auto; border-top: 1px solid var(--border); padding-top: 10px; }
  .side-meter { margin-bottom: 8px; }
  .side-meter .row { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-2); margin-bottom: 3px; }
  .side-meter .row b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .side-bar { height: 4px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .side-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
  .side-tag { font-size: 9.5px; color: var(--muted-2); line-height: 1.5; margin-top: 8px; }
  .side-user { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); margin-top: 9px; }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-tint); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; flex: 0 0 auto;
  }
  .side-signout { background: none; border: none; color: var(--muted-2); font-size: 10px; font-family: inherit; cursor: pointer; padding: 0; text-decoration: underline dotted; }
  .side-signout:hover { color: var(--critical); }

  /* メイン領域：ヘッダー行（データ鮮度）＋タブごとのパネル */
  .main-area { display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden; }
  .main-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(126,206,244,.05), transparent);
  }
  .main-bar h1 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  .main-bar .meta { font-size: 10.5px; color: var(--muted-2); display: flex; gap: 14px; }
  .main-bar .meta b { color: var(--muted); font-weight: 700; }
  .panels { min-height: 0; overflow: hidden; padding: 12px 14px; }

  /* ログインゲートは画面全体を覆うオーバーレイ（背後のダッシュボードを透けさせない） */
  #loginGate {
    position: fixed; inset: 0; z-index: 50;
    background:
      radial-gradient(ellipse 900px 560px at 50% 36%, var(--accent-tint), transparent 62%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 32px;
  }
  #loginGate .brand-lockup { margin-bottom: 34px; }
  #loginGate .mark-icon {
    width: 64px; height: 64px; margin: 0 auto 20px; display: block;
    border-radius: 14px;
    filter: drop-shadow(0 10px 26px var(--accent-glow));
  }
  #loginGate .wordmark-plate {
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 10px; padding: 13px 24px;
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
  }
  #loginGate .wordmark { height: 19px; display: block; }
  #loginGate h2 { font-size: 17px; font-weight: 700; letter-spacing: .06em; margin: 0 0 10px; color: var(--muted); }
  #loginGate p { color: var(--muted); margin: 0 0 28px; line-height: 1.8; font-size: 12.5px; }
  #loginGate .gate-tag { color: var(--muted-2); font-size: 11px; margin-top: 32px; letter-spacing: .04em; }
  #statusMsg {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40;
    background: var(--card-2); border: 1px solid var(--border-2); border-radius: 999px;
    color: var(--muted); font-size: 11.5px; padding: 6px 18px; box-shadow: var(--shadow-md);
  }
  #statusMsg.error { color: var(--critical); border-color: var(--critical-border); }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    margin: 56px 0 18px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    /* 識学の組織図が「同格を水平線で揃える」作法を借りた、細い基準線 */
    content: '';
    display: inline-block;
    width: 20px; height: 1px;
    background: var(--muted-2);
  }

  /* ── カード出現：読み込み時に一括ではなく、スクロールして画面に入ってきた瞬間に浮き上がる ── */
  .reveal-pending {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  .reveal-pending.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal-pending { transition: none; opacity: 1; transform: none; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 13px;
    margin-bottom: 4px;
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  tr.header-row td {
    font-weight: 700;
    background: var(--card-2);
    color: var(--muted);
    font-variant-numeric: normal;
  }

  #signInBtnHolder { display: flex; justify-content: center; }
  #signInBtnHolder button {
    background: var(--accent);
    color: var(--brand-navy);
    border: none;
    border-radius: 8px;
    padding: 11px 30px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(100,192,171,.25);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #signInBtnHolder button:hover { background: #7bd0bc; transform: translateY(-1px); box-shadow: 0 8px 22px rgba(100,192,171,.35); }
  #signInBtnHolder button:active { transform: translateY(0); box-shadow: 0 4px 12px rgba(100,192,171,.25); }

  button.secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  button.secondary:hover { background: var(--bg); }

  /* 報告タブごとに入力カードが出るのでIDではなくクラスで指定する */
  .input-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 20px 22px;
    margin-bottom: 28px;
  }
  .input-card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 700; }
  .field-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .field-row:last-of-type { border-bottom: none; }
  .field-row label { flex: 0 0 260px; font-size: 13px; color: var(--muted); }
  .field-row input, .field-row textarea {
    flex: 1;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .field-row input:focus, .field-row textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field-row textarea { resize: vertical; min-height: 44px; }
  .save-btn {
    margin-top: 16px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .save-btn:hover:not(:disabled) { opacity: .85; }
  .save-btn:disabled { opacity: 0.55; cursor: default; box-shadow: none; }
  .save-msg { font-size: 13px; margin-top: 10px; font-weight: 600; }
  .save-msg.ok { color: var(--good); }
  .save-msg.error { color: var(--critical); }

  .viewer-note {
    font-size: 13px;
    color: var(--muted);
    background: var(--accent-tint);
    border: 1px solid #d9dcfb;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
  }

  .chart-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 22px 24px 18px;
    margin-bottom: 12px;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .chart-legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .chart-bar-label { font-size: 11px; fill: var(--muted); }
  .chart-value-label { font-size: 11px; fill: var(--text); font-weight: 700; }
  .chart-card rect { transition: opacity .1s; }
  .chart-card rect:hover { opacity: .8; }
  .chart-gridline { stroke: var(--border); stroke-width: 1; }

  /* ── ヒーロー：箱を持たず、背景に静かに溶け込ませる。主張するのは数字と余白だけ ── */
  .hero {
    position: relative;
    padding: 8px 0 56px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .hero-text h2 {
    font-family: var(--display-font);
    font-size: 32px;
    margin: 0 0 22px;
    font-weight: 400;
    letter-spacing: .01em;
    line-height: 1.45;
    color: var(--text);
  }
  .hero .period {
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    color: var(--muted);
  }
  .hero-ring { flex: 0 0 auto; text-align: center; }
  .hero-ring svg { display: block; }
  .hero-ring .ring-label { font-size: 11px; opacity: .68; margin-top: 8px; font-weight: 400; letter-spacing: .04em; }

  /* ── 目標ギャップのタイル ── */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 8px;
  }
  .tile {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 24px 26px 26px;
    transition: box-shadow .25s cubic-bezier(.16,1,.3,1), transform .25s cubic-bezier(.16,1,.3,1);
  }
  .tile:hover { box-shadow: var(--shadow-glass-hover); transform: translateY(-3px); }
  .tile-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tile-name { font-size: 14px; font-weight: 700; color: var(--muted); }
  .tile-status {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    padding: 4px 12px 4px 9px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tile-status::before, .member-pace::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
  }
  /* 淡いtintではなく、はっきり読める実色バッジにする（視認性優先） */
  .tile-status.good { background: var(--good); color: #06281a; }
  .tile-status.warning { background: var(--warning); color: #2c2308; }
  .tile-status.critical { background: var(--critical); color: #2a0b0b; }
  .tile-value {
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .tile-value .of {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted-2);
    margin-left: 6px;
  }
  .bar-track {
    height: 9px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 10px;
  }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.16,1,.3,1); }

  /* ── 位置：まず塗りバーで「どれだけ埋まっているか」を瞬時に見せ、
     その上に実績の点とMUSTの目印を重ねて「正確な位置」も示す（視認性優先） ── */
  .pos-track {
    position: relative;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    margin: 22px 4px 20px;
    overflow: visible;
  }
  .pos-fill {
    position: absolute;
    inset: 0;
    right: auto;
    border-radius: 999px;
    transition: width .9s cubic-bezier(.16,1,.3,1);
  }
  .pos-dot {
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 3px var(--bg);
    transition: left .9s cubic-bezier(.16,1,.3,1);
  }
  .pos-tick {
    position: absolute;
    top: 50%;
    width: 2px; height: 20px;
    background: var(--text);
    opacity: .6;
    transform: translate(-50%, -50%);
  }
  .pos-tick::after {
    content: attr(data-label);
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .pos-dot::after {
    content: attr(data-label);
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
  }
  .tile-meta {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: var(--bg);
    border-radius: 999px;
    padding: 4px 11px;
    white-space: nowrap;
  }
  .chip.delta-behind { background: var(--critical-tint); color: var(--critical); font-weight: 700; }
  .chip.delta-ahead { background: var(--good-tint); color: var(--good); font-weight: 700; }
  .tile-note { font-size: 12px; color: var(--muted-2); margin-top: 8px; line-height: 1.5; }

  /* ── ファネル ── */
  .funnel-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 28px 30px 22px;
    margin-bottom: 8px;
  }
  .funnel {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 4px 2px;
    row-gap: 16px;
  }
  .funnel-step { text-align: center; flex: 1 1 56px; min-width: 56px; }
  .funnel-step .n { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .funnel-step .bar {
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    margin: 8px 0 6px;
  }
  .funnel-step .l { font-size: 11px; color: var(--muted); }
  .funnel-arrow {
    flex: 0 0 auto;
    align-self: center;
    text-align: center;
    padding-bottom: 22px;
  }
  .funnel-arrow .rate {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    background: var(--accent-tint); color: var(--accent-dark);
    border-radius: 999px; padding: 2px 8px;
    margin-bottom: 2px;
  }
  .funnel-arrow .arrow-ico { display: block; color: var(--muted-2); font-size: 12px; }

  /* ── 歩留まり詳細（普段は隠す・クリックで展開） ── */
  .detail-disclosure {
    margin: 10px 0 18px;
  }
  .detail-disclosure summary {
    cursor: pointer;
    list-style: none;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .detail-disclosure summary::-webkit-details-marker { display: none; }
  .detail-disclosure summary::before { content: '▸'; font-size: 10px; }
  .detail-disclosure[open] summary::before { content: '▾'; }
  .detail-disclosure summary:hover { color: var(--text); border-color: var(--accent); }
  .detail-disclosure .table-scroll { margin-top: 10px; }

  /* ── 過去実績：期セレクター（現状は12期のみ。将来13期が並ぶ枠） ── */
  .term-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .term-bar-label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); margin-right: 4px; }
  .term-btn {
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 6px 15px; border-radius: 999px;
  }
  .term-btn.active { background: var(--accent); border-color: var(--accent); color: #0a0d16; }
  .term-btn.future { opacity: .35; }

  /* ── 結果の完了タブ最上部：評価項目サマリー（商談実施数／P2コンサル部提案提供数／新規獲得件数）
     3枚を横並びで見渡せるよう、mainの拡幅とあわせてカード最小幅を絞っている ── */
  .kpi-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .kpi-summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px; }
  .kpi-summary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .kpi-summary-card h3 { font-size: 12px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 6px; }
  .kpi-summary-card h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px var(--accent-glow); flex: 0 0 auto; }
  .kpi-summary-conv { font-size: 10px; font-weight: 700; color: var(--accent-2); white-space: nowrap; }
  /* 「対営業日進捗」の行ラベルが長く、auto幅だと達成率列を圧迫してはみ出す（overflow:hiddenで欠けて見える）ため
     列幅を固定して確保する */
  .kpi-summary-card table { font-size: 12.5px; table-layout: fixed; }
  .kpi-summary-card td { padding: 3px 4px; overflow: hidden; text-overflow: ellipsis; }
  .kpi-summary-card td:first-child { width: 34%; padding-left: 6px; }
  .kpi-summary-card td:not(:first-child) { width: 16.5%; text-align: right; }
  .kpi-summary-card td:last-child { text-align: center; padding-right: 6px; }
  tr.kpi-summary-q td { font-weight: 700; }
  tr.kpi-summary-pace td { background: var(--card-2); }
  .kpi-more-row td { padding-top: 6px; padding-bottom: 0; }
  .kpi-more-btn { background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; padding: 2px 0; font-family: inherit; text-decoration: underline dotted var(--muted-2); }
  .kpi-more-btn:hover { color: var(--accent); }

  /* ── 結果の完了タブ：歩留まりファネル＋対応が必要な案件（統合ホーム案） ── */
  .funnel-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px; }
  .funnel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; flex-wrap: wrap; gap: 8px; flex: 0 0 auto; }
  .funnel-head h3 { font-size: 12px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 6px; }
  .funnel-head h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px var(--accent-glow); flex: 0 0 auto; }
  .funnel-sub { font-size: 10px; color: var(--muted-2); margin-bottom: 2px; flex: 0 0 auto; }
  .seg-toggle { display: flex; background: var(--card-2); border-radius: 999px; padding: 2px; gap: 2px; }
  .seg-toggle button { background: none; border: none; color: var(--muted); font-size: 10.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  .seg-toggle button.active { background: var(--accent); color: var(--brand-navy); }
  .seg-toggle button:not(.active):hover { color: var(--text); }
  /* 10段すべてを横スクロールなしで収めるため、矢印の列は作らず、率は各段の上に重ねる */
  .funnel-row { display: flex; align-items: stretch; gap: 2px; padding-bottom: 2px; flex: 1; min-height: 60px; }
  .funnel-stage { flex: 1 1 0; min-width: 0; text-align: center; position: relative; padding: 12px 0 0; display: flex; flex-direction: column; }
  .funnel-stage .n { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .funnel-stage .l { font-size: 9px; color: var(--muted); margin-top: 1px; flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .funnel-bar-wrap { flex: 1; min-height: 20px; display: flex; align-items: flex-end; justify-content: center; margin: 3px 0; }
  .funnel-bar { width: 70%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--accent-2), var(--accent)); min-height: 3px; box-shadow: 0 0 8px var(--accent-glow); }
  /* 各段の左上に「直前の段からの転換率」を出す（矢印列の代わり） */
  .funnel-stage .pct {
    position: absolute; top: 0; left: 0; right: 0;
    font-size: 9px; font-weight: 700; color: var(--muted-2); white-space: nowrap;
  }
  .funnel-stage .pct::before { content: '▸ '; color: var(--border-2); }
  .funnel-stage .pct.low { color: var(--critical); }
  .funnel-legend { display: flex; gap: 12px; margin-top: 5px; font-size: 10px; color: var(--muted-2); flex-wrap: wrap; flex: 0 0 auto; }
  .funnel-legend b { color: var(--text); font-weight: 700; }
  .breakdown { display: none; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .breakdown.active { display: block; }
  .breakdown .note { font-size: 11px; color: var(--muted-2); margin-bottom: 8px; }
  .breakdown table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .breakdown td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .breakdown tr:last-child td { border-bottom: none; }
  .breakdown tr.header-row td { color: var(--muted-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  .breakdown td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .deals-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px 6px; }
  .deals-card h3 { font-size: 12px; font-weight: 700; margin: 0 0 1px; display: flex; align-items: center; gap: 6px; }
  .deals-card h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 5px rgba(255,200,0,.5); flex: 0 0 auto; }
  .deals-sub { font-size: 10px; color: var(--muted-2); margin-bottom: 6px; }
  .deal-row { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-top: 1px solid var(--border); text-decoration: none; color: inherit; }
  .deal-row:first-of-type { border-top: none; }
  .deal-row:hover { background: var(--card-2); border-radius: 6px; }
  .deal-stage { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px; flex: 0 0 auto; white-space: nowrap; }
  .deal-stage.p2 { background: var(--accent-tint); color: var(--accent); }
  .deal-stage.pn { background: var(--warning-tint); color: var(--warning); }
  .deal-main { flex: 1; min-width: 0; }
  .deal-main .company { font-size: 11.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deal-main .meta { font-size: 9.5px; color: var(--muted-2); }
  .deal-days { font-size: 10px; font-weight: 700; color: var(--critical); flex: 0 0 auto; white-space: nowrap; }
  .deal-open { flex: 0 0 auto; display: flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 700; color: var(--accent-2); }
  .deal-open svg { width: 10px; height: 10px; }
  .deals-empty { padding: 10px 2px; color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .deals-empty::before { content: '✓'; color: var(--good); font-weight: 700; }

  /* ══ 結果の完了タブ：ミッションコントロール型グリッド ══
     12列×3行でビューポートの残り高さをぴったり埋める。ページはスクロールさせず、
     内容がはみ出すカードだけがカード内でスクロールする */
  .mc-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: 1fr 1.15fr 0.9fr;
    gap: 10px;
    height: 100%;
    min-height: 0;
  }
  /* 全カード共通：グリッドセルより高くならず、中身が多いときだけ内部スクロール */
  .mc-grid > * { min-height: 0; max-height: 100%; overflow-y: auto; margin: 0 !important; }
  .mc-grid .next-action   { grid-column: span 3; }
  .mc-grid .kpi-summary-card { grid-column: span 3; }
  .mc-grid .funnel-card   { grid-column: span 8; display: flex; flex-direction: column; overflow: hidden; }
  .mc-grid .deals-card    { grid-column: span 4; display: flex; flex-direction: column; }
  .mc-grid .activity-card { grid-column: span 3; }
  .mc-grid .trend-card    { grid-column: span 3; display: flex; flex-direction: column; overflow: hidden; }
  .mc-grid .memo-card     { grid-column: span 3; }
  .mc-grid .report-card   { grid-column: span 3; }
  /* 狭い画面では段組みを崩し、パネル内スクロールに切り替える */
  @media (max-width: 1100px) {
    .mc-grid { grid-template-rows: none; grid-auto-rows: minmax(160px, auto); height: auto; }
    #panel-kekka.active { overflow-y: auto; }
    .mc-grid .next-action, .mc-grid .kpi-summary-card, .mc-grid .deals-card,
    .mc-grid .activity-card, .mc-grid .trend-card, .mc-grid .memo-card, .mc-grid .report-card { grid-column: span 6; }
    .mc-grid .funnel-card { grid-column: 1 / -1; }
    .mc-grid > * { max-height: none; }
  }

  /* ネクストアクション：数字カードより上位。事実→行動を根拠つきで示す */
  .next-action {
    background: linear-gradient(150deg, var(--accent-tint), transparent 70%);
    border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 11px 14px; display: flex; flex-direction: column; gap: 9px;
  }
  .next-action .eyebrow { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; color: var(--accent); flex: 0 0 auto; }
  .next-action ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .next-action li { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; line-height: 1.5; }
  .next-action .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; margin-top: 6px; box-shadow: 0 0 6px var(--accent-glow); }
  .next-action .why { color: var(--muted-2); font-size: 10.5px; display: block; margin-top: 2px; }
  .next-action.ok { border-color: var(--good); background: linear-gradient(150deg, var(--good-tint), transparent 70%); }
  .next-action.ok .eyebrow { color: var(--good); }
  .next-action.ok .dot { background: var(--good); box-shadow: none; }

  /* 週次トレンド：ファネルから切り出して独立カードにする */
  .trend-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px; }
  .trend-card h3 { font-size: 12px; font-weight: 700; margin: 0 0 2px; }
  .trend-card .sub { font-size: 10px; color: var(--muted-2); margin-bottom: 8px; }
  .trend-card .plot { flex: 1; min-height: 0; display: flex; align-items: flex-end; }
  .trend-card svg { width: 100%; height: 100%; display: block; }
  .trend-legend { display: flex; gap: 12px; font-size: 10px; color: var(--muted-2); margin-top: 6px; flex: 0 0 auto; }
  .trend-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; }

  /* 直近の活動：分析■6（商談分析）から会社名つきで最新順に表示。ミッションコントロール的な「動いている感」を出す */
  .activity-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px 6px; }
  .activity-card h3 { font-size: 12px; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .activity-card h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--good); box-shadow: 0 0 5px rgba(100,154,91,.6); flex: 0 0 auto; }
  .activity-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .activity-row:first-of-type { border-top: none; }
  .activity-rank { font-size: 9px; font-weight: 800; width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .activity-rank.rank-a, .activity-rank.rank-b { background: var(--good-tint); color: var(--good); }
  .activity-rank.rank-c { background: var(--warning-tint); color: var(--warning); }
  .activity-rank.rank-d { background: var(--critical-tint); color: var(--critical); }
  .activity-main { flex: 1; min-width: 0; }
  .activity-main .company { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity-main .meta { font-size: 9.5px; color: var(--muted-2); }
  .activity-date { font-size: 9.5px; color: var(--muted-2); flex: 0 0 auto; white-space: nowrap; }

  /* 日報・週報・月報：数字だけの入口カード。開くとモーダルで既存の入力フォーム一式を出す */
  .report-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px; display: flex; flex-direction: column; }
  .report-card h3 { font-size: 12px; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .report-card h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-3); box-shadow: 0 0 5px rgba(65,56,147,.6); flex: 0 0 auto; }
  .report-card .row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 3px 0; border-top: 1px solid var(--border); }
  .report-card .row:first-of-type { border-top: none; }
  .report-card .row span { color: var(--muted); }
  .report-card .row b { font-variant-numeric: tabular-nums; }
  .report-open-btn { margin-top: auto; background: var(--accent-tint); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 700; padding: 7px 0; border-radius: 6px; text-align: center; cursor: pointer; font-family: inherit; }
  .report-open-btn:hover { background: var(--accent); color: var(--brand-navy); }
  /* 日報・週報・月報の本体はモーダルで開く（1画面を崩さないため） */
  #kekkaReportDetail {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: rgba(8,15,28,.86); padding: 32px 5vw; overflow-y: auto;
  }
  #kekkaReportDetail.open { display: block; }
  #kekkaReportDetail .modal-inner { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 18px 22px 26px; box-shadow: var(--shadow-md); }
  #kekkaReportClose { position: sticky; top: 0; float: right; background: var(--card-2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  #kekkaReportClose:hover { color: var(--text); border-color: var(--border-2); }

  /* ── 自由メモ（スプシ「メモ」タブのミラー表示） ── */
  .memo-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-glass); padding: 11px 14px; }
  .memo-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .memo-head h3 { font-size: 12px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 6px; }
  .memo-head h3::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 5px rgba(126,206,244,.5); flex: 0 0 auto; }
  .memo-edit-link { font-size: 10px; font-weight: 700; color: var(--accent-2); text-decoration: none; white-space: nowrap; }
  .memo-edit-link:hover { text-decoration: underline; }
  .memo-line { font-size: 11px; color: var(--muted); padding: 2px 0; white-space: pre-wrap; }
  .memo-card .table-scroll { margin: 4px 0; }
  .memo-card table { font-size: 10.5px; }
  .memo-card td { padding: 4px 6px; }
  .memo-empty { padding: 6px 0; color: var(--muted-2); font-size: 11px; }

  /* ── 過去実績：メンバー別実績表（評価項目の強調＋項目ごとの表示トグル） ── */
  .past-kpi { color: var(--accent); font-weight: 800; background: var(--accent-tint); }
  tr.header-row td.past-kpi { color: var(--accent-dark); }
  .past-rate { color: var(--muted); font-weight: 500; font-size: 11.5px; margin-left: 5px; }
  td.past-kpi .past-rate { color: var(--accent-dark); }
  .past-rate-stack { display: block; margin-left: 0; margin-top: 2px; }
  .past-clickable { cursor: pointer; }
  .past-clickable:hover { text-decoration: underline dotted var(--muted); }
  .past-click-detail { color: var(--accent); }
  .past-achieve {
    display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700;
    padding: 1px 7px; border-radius: 999px; background: var(--track); color: var(--muted); cursor: default;
  }
  .past-achieve.good { background: var(--good-tint); color: var(--good); }
  .past-achieve.warning { background: var(--warning-tint); color: var(--warning); }
  .past-achieve.critical { background: var(--critical-tint); color: var(--critical); }
  .past-col-toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .past-col-toggles .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); align-self: center; margin-right: 4px; }
  .past-col-chip {
    background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  }
  .past-col-chip:hover { color: var(--text); border-color: var(--accent); }
  .past-col-chip.active { color: var(--accent-dark); background: var(--accent-tint); border-color: var(--accent); }
  [data-past-col] { display: none; }

  /* ── メンバーカード ── */
  /* ── 同格を水平線で揃える：識学の組織図の作法をそのまま借りる。全員が同じ基準線の上に立つ ── */
  .rank-strip {
    position: relative;
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 2px;
    background: var(--muted-2);
    opacity: .4;
    margin: 8px 24px 40px;
  }
  .rank-node {
    position: relative;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .rank-node::after {
    content: attr(data-label);
    position: absolute;
    top: 46px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .member-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    margin-bottom: 8px;
  }
  .member-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 22px 24px;
    transition: box-shadow .25s cubic-bezier(.16,1,.3,1), transform .25s cubic-bezier(.16,1,.3,1);
  }
  .member-card:hover { box-shadow: var(--shadow-glass-hover); transform: translateY(-3px); }
  .member-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .member-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    flex: 0 0 auto;
  }
  .member-name { font-size: 14px; font-weight: 700; flex: 1; }
  .member-pace {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px 3px 7px; border-radius: 999px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .member-pace.good { background: var(--good-tint); color: var(--good); }
  .member-pace.warning { background: var(--warning-tint); color: var(--warning); }
  .member-pace.critical { background: var(--critical-tint); color: var(--critical); }
  .metric-line { margin-top: 9px; }
  .metric-line .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .metric-line .row b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-line .bar-track { height: 6px; margin: 0; }
  .member-foot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 10px;
  }
  .member-foot b { color: var(--text); }

  /* ── アクション・警告 ── */
  .action-list { margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  .action-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 13px;
    display: flex;
    align-items: flex-start;

  if (label.startsWith('【月報】')) return 'monthly';

}

  const cells = manualCellsFor(tab);

  cells.forEach((def, i) => { if (groupOfLabel(def.label) === group) picked.push({ def, row: 4 + i }); });

window.addEventListener('load', () => {
  // file:// で直接開くとOAuthの許可オリジンに一致せず必ず認証エラーになるため、先に案内する
  if (location.protocol === 'file:') {
    document.getElementById('loginGate').innerHTML =
      '<p>このファイルを直接開いてもログインできません。<br>' +
      '下のリンクから公開ページを開いてください。</p>' +
      '<p><a href="https://masuda15k.github.io/kpi-dashboard/">https://masuda15k.github.io/kpi-dashboard/</a></p>';
    return;
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: handleTokenResponse,
    // サードパーティCookieがブロックされていても裏側の自動更新（prompt:''）が通るように、
    // FedCM経由でのサイレント認証を使う（毎回アカウント選択画面が出てしまう問題の対策）
    use_fedcm_for_prompt: true,
    error_callback: (err) => {
      if (hasCompletedSignIn) {
        // 裏側での自動更新に失敗＝Google側のセッションが切れている。ログイン画面に戻す
        resetToSignedOut();
        showStatus('セッションの有効期限が切れました。再度ログインしてください。', true);
      } else if (isAutoSignInAttempt) {
        // 再訪問時の自動サインインが失敗しただけなので、静かにボタン操作に戻す
        isAutoSignInAttempt = false;
        hideStatus();
      } else {
        showStatus('ログインできませんでした：' + (err?.type || '不明なエラー'), true);
      }
    },
  });

  // Google標準の「Googleでログイン」ボタンではなく、シンプルなクリックボタンでトークンクライアントを起動する
  const btn = document.createElement('button');
  btn.textContent = 'Googleでログイン';
  btn.onclick = () => tokenClient.requestAccessToken({ prompt: 'consent' });
  document.getElementById('signInBtnHolder').appendChild(btn);

  // 前回サインイン済みのブラウザなら、ボタン操作なしで静かに再認証を試みる（Google側のセッションが生きていれば即ログイン）
  if (localStorage.getItem(AUTO_SIGNIN_KEY) === '1') {
    isAutoSignInAttempt = true;
    showStatus('自動ログイン中...', false);
    tokenClient.requestAccessToken({ prompt: '' });
  }
});

function handleTokenResponse(resp) {
  isAutoSignInAttempt = false;
  if (resp.error) {
    showStatus('ログインに失敗しました：' + resp.error, true);
    return;
  }
  accessToken = resp.access_token;
  localStorage.setItem(AUTO_SIGNIN_KEY, '1');
  scheduleTokenRefresh(resp.expires_in);
  if (!hasCompletedSignIn) {
    hasCompletedSignIn = true;
    completeSignIn();
  } else {
    hideStatus(); // 裏側での更新完了。画面はそのまま
  }
}

// 期限が切れる前にユーザー操作なしでトークンを更新し続ける（REQ: トークン自動リフレッシュ）
function scheduleTokenRefresh(expiresInSec) {
  clearTimeout(refreshTimer);
  const delayMs = Math.max(10, (Number(expiresInSec) || 3600) - REFRESH_MARGIN_SEC) * 1000;
  refreshTimer = setTimeout(() => {
    tokenClient.requestAccessToken({ prompt: '' });
  }, delayMs);
}

function resetToSignedOut() {
  accessToken = null;
  hasCompletedSignIn = false;
  clearTimeout(refreshTimer);
  localStorage.removeItem(AUTO_SIGNIN_KEY);
  document.getElementById('loginGate').style.display = 'flex'; // CSSでflex中央寄せしているため
  document.getElementById('memberBar').style.display = 'none';
  document.getElementById('tabNav').style.display = 'none';
  document.getElementById('tabPanels').style.display = 'none';
  document.getElementById('userBox').style.display = 'none';
}

async function completeSignIn() {
  document.getElementById('loginGate').style.display = 'none';

  try {
    const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` },
    });
    const user = await userRes.json();
    myProfile = MEMBER_MAP[user.email] || null;
    document.getElementById('userBox').style.display = 'flex';
    document.getElementById('userName').textContent = myProfile ? `${myProfile.label}さん` : (user.email || 'ログイン中');
    document.getElementById('userAvatar').textContent = (myProfile?.label || user.email || '?').charAt(0);
  } catch (e) {
    showStatus('ユーザー情報の取得に失敗しました：' + e.message, true);
  }

  // ログイン直後は自分の担当分から見せる（メンバーなら自分、増田さん・その他は1係全体）
  if (myProfile && myProfile.tab !== SHEET_REPORT) selectedMember = myProfile.tab;
  syncMemberBar();

  document.getElementById('memberBar').style.display = 'flex';
  document.getElementById('tabNav').style.display = 'flex';
  document.getElementById('tabPanels').style.display = 'block';
  await renderCurrentView();
}
