<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1係 KPIダッシュボード</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f8;
    --card: #ffffff;
    --border: #e7e8f0;
    --text: #14161f;
    --muted: #6b7280;
    --muted-2: #9aa0ac;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --accent-tint: #eef0ff;
    --good: #059669;      --good-tint: #e7f7f1;      --good-border: #b7e6d3;
    --warning: #b45309;   --warning-tint: #fff6e5;   --warning-border: #f3ddac;
    --critical: #dc2626;  --critical-tint: #fdecec;  --critical-border: #f6c2c2;
    --track: #edeef3;
    --shadow-sm: 0 1px 2px rgba(20,22,31,.05), 0 1px 3px rgba(20,22,31,.06);
    --shadow-md: 0 6px 16px -4px rgba(20,22,31,.12), 0 2px 6px -2px rgba(20,22,31,.06);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-tint); }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .01em; }
  #userBox { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-tint); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  main { max-width: 960px; margin: 28px auto 64px; padding: 0 16px; }

  #loginGate {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 56px 24px;
    text-align: center;
  }
  #loginGate p { color: var(--muted); margin-bottom: 20px; line-height: 1.7; }
  #statusMsg { text-align: center; color: var(--muted); margin: 24px 0; font-size: 13px; }
  #statusMsg.error { color: var(--critical); }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    margin: 28px 0 10px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 4px; height: 14px;
    border-radius: 2px;
    background: var(--accent);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
    margin-bottom: 4px;
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  tr.header-row td {
    font-weight: 700;
    background: #fafafd;
    color: var(--muted);
    font-variant-numeric: normal;
  }

  #signInBtnHolder { display: flex; justify-content: center; }
  #signInBtnHolder button {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .15s, transform .15s;
  }
  #signInBtnHolder button:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

  button.secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  button.secondary:hover { background: var(--bg); }

  #inputForm {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 20px 22px;
    margin-bottom: 28px;
  }
  #inputForm h2 { font-size: 15px; margin: 0 0 14px; font-weight: 700; }
  .field-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .field-row:last-of-type { border-bottom: none; }
  .field-row label { flex: 0 0 260px; font-size: 13px; color: var(--muted); }
  .field-row input, .field-row textarea {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .field-row input:focus, .field-row textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field-row textarea { resize: vertical; min-height: 44px; }
  #saveBtn {
    margin-top: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  #saveBtn:disabled { opacity: 0.55; cursor: default; box-shadow: none; }
  #saveMsg { font-size: 13px; margin-top: 10px; font-weight: 600; }
  #saveMsg.ok { color: var(--good); }
  #saveMsg.error { color: var(--critical); }

  .viewer-note {
    font-size: 13px;
    color: var(--muted);
    background: var(--accent-tint);
    border: 1px solid #d9dcfb;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 24px;
  }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px 12px;
    margin-bottom: 12px;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .chart-legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .chart-bar-label { font-size: 11px; fill: var(--muted); }
  .chart-value-label { font-size: 11px; fill: var(--text); font-weight: 700; }
  .chart-card rect { transition: opacity .1s; }
  .chart-card rect:hover { opacity: .8; }
  .chart-gridline { stroke: var(--border); stroke-width: 1; }

  /* ── ヒーロー ── */
  .hero {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    border-radius: 18px;
    padding: 26px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-text h2 { font-size: 18px; margin: 0 0 10px; font-weight: 700; }
  .hero .period {
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hero .period span {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .hero-ring { flex: 0 0 auto; text-align: center; }
  .hero-ring svg { display: block; }
  .hero-ring .ring-label { font-size: 11px; opacity: .85; margin-top: 4px; }

  /* ── 目標ギャップのタイル ── */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px 18px;
    transition: box-shadow .15s, transform .15s;
  }
  .tile:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .tile-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tile-name { font-size: 13px; font-weight: 700; color: var(--muted); }
  .tile-status {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .tile-status.good { background: var(--good-tint); color: var(--good); }
  .tile-status.warning { background: var(--warning-tint); color: var(--warning); }
  .tile-status.critical { background: var(--critical-tint); color: var(--critical); }
  .tile-value {
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .tile-value .of {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted-2);
    margin-left: 6px;
  }
  .bar-track {
    height: 9px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 10px;
  }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .tile-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: var(--bg);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .chip.delta-behind { background: var(--critical-tint); color: var(--critical); font-weight: 700; }
  .chip.delta-ahead { background: var(--good-tint); color: var(--good); font-weight: 700; }
  .tile-note { font-size: 12px; color: var(--muted-2); margin-top: 8px; line-height: 1.5; }

  /* ── ファネル ── */
  .funnel-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 20px 22px 14px;
    margin-bottom: 8px;
  }
  .funnel {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 4px 2px;
    row-gap: 16px;
  }
  .funnel-step { text-align: center; flex: 1 1 56px; min-width: 56px; }
  .funnel-step .n { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .funnel-step .bar {
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    margin: 8px 0 6px;
  }
  .funnel-step .l { font-size: 11px; color: var(--muted); }
  .funnel-arrow {
    flex: 0 0 auto;
    align-self: center;
    text-align: center;
    padding-bottom: 22px;
  }
  .funnel-arrow .rate {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    background: var(--accent-tint); color: var(--accent-dark);
    border-radius: 999px; padding: 2px 8px;
    margin-bottom: 2px;
  }
  .funnel-arrow .arrow-ico { display: block; color: var(--muted-2); font-size: 12px; }

  /* ── メンバーカード ── */
  .member-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }
  .member-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
    transition: box-shadow .15s, transform .15s;
  }
  .member-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .member-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .member-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    flex: 0 0 auto;
  }
  .member-name { font-size: 14px; font-weight: 700; flex: 1; }
  .member-pace {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .member-pace.good { background: var(--good-tint); color: var(--good); }
  .member-pace.warning { background: var(--warning-tint); color: var(--warning); }
  .member-pace.critical { background: var(--critical-tint); color: var(--critical); }
  .metric-line { margin-top: 9px; }
  .metric-line .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .metric-line .row b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-line .bar-track { height: 6px; margin: 0; }
  .member-foot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 10px;
  }
  .member-foot b { color: var(--text); }

  /* ── アクション・警告 ── */
  .action-list { margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  .action-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: var(--shadow-sm);
  }
  .action-ico {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    margin-top: 1px;
  }
  .action-item.critical .action-ico { background: var(--critical-tint); }
  .action-item.warning .action-ico { background: var(--warning-tint); }
  .action-item.good .action-ico { background: var(--good-tint); }
  .action-text { flex: 1; line-height: 1.5; }

  .notice {
    background: var(--warning-tint);
    border: 1px solid var(--warning-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 横長の表は表の中だけスクロールさせ、ページ本体は横スクロールさせない */
  .table-scroll { overflow-x: auto; margin-bottom: 4px; }
  .table-scroll table { margin-bottom: 0; }

  @media (max-width: 480px) {
    main { padding: 0 10px; }
    .hero { padding: 20px; }
    .funnel-card { padding: 16px 12px 10px; }
    .field-row { flex-direction: column; align-items: stretch; gap: 4px; }
    .field-row label { flex: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">識</div>
    <h1>1係 KPIダッシュボード</h1>
  </div>
  <div id="userBox" style="display:none;">
    <span class="avatar" id="userAvatar"></span>
    <span id="userName"></span>
    <button class="secondary" id="signOutBtn">ログアウト</button>
  </div>
</header>

<main>
  <div id="loginGate">
    <p>識学Googleアカウントでログインしてください（社外アカウントではログインできません）</p>
    <div id="signInBtnHolder"></div>
  </div>

  <div id="statusMsg" style="display:none;"></div>
  <div id="viewerNote" class="viewer-note" style="display:none;">あなたは閲覧のみです（入力はメンバー本人のみ行えます）</div>
  <div id="inputForm" style="display:none;"></div>
  <div id="dashboardRoot" style="display:none;"></div>
</main>

<script>
// ── 設定 ──────────────────────────────────────────
const CLIENT_ID = '315650091875-4b15pp0ue46gp6b8e2uitksc5ea5h6g6.apps.googleusercontent.com';
const SPREADSHEET_ID = '1qHftqur_IDqjc97VnfMopSnMeQj6z5U-m5x68O1Ahkw';
const SHEET_RANGE = 'ダッシュボード'; // タブ名のみ＝実データがある範囲を自動取得（列I等の追加列があっても切れない）
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';

// ログイン中のメールアドレス → 本人の手入力タブ名（メンバー4名のみ。それ以外は閲覧のみ）
const MEMBER_MAP = {
  'kazumasasugawara@shikigaku.com': '菅原',
  'kayomaruno@shikigaku.com': '丸野',
  'wataruebato@shikigaku.com': '江波戸',
  'takahiroiiyama@shikigaku.com': '飯山',
};

// kpi-v3-core.js の MEMBER_MANUAL_CELLS と1対1で対応（B4:B17・この順序のまま）
const MEMBER_MANUAL_CELLS = [
  { key: 'nextDayCreate', label: '【日次】次の約束：商談作成数', type: 'number' },
  { key: 'nextDayYotei',  label: '【日次】次の約束：商談予定数', type: 'number' },
  { key: 'nextDayShadan', label: '【日次】次の約束：商談実施数', type: 'number' },
  { key: 'nextDayP2',     label: '【日次】次の約束：コンサル部提案提供数', type: 'number' },
  { key: 'nextDayP3',     label: '【日次】次の約束：提案済数', type: 'number' },
  { key: 'nextDayClose',  label: '【日次】次の約束：新規獲得数', type: 'number' },
  { key: 'weeklyReason',  label: '【週報】不足の理由', type: 'textarea' },
  { key: 'weeklyAction',  label: '【週報】行動変化', type: 'textarea' },
  { key: 'nextWeekCreate', label: '【週報】次週の約束：商談作成数', type: 'number' },
  { key: 'nextWeekYotei',  label: '【週報】次週の約束：商談予定数', type: 'number' },
  { key: 'nextWeekShadan', label: '【週報】次週の約束：商談実施数', type: 'number' },
  { key: 'nextWeekP2',     label: '【週報】次週の約束：コンサル部提案提供数', type: 'number' },
  { key: 'nextWeekP3',     label: '【週報】次週の約束：提案済', type: 'number' },
  { key: 'nextWeekClose',  label: '【週報】次週の約束：新規獲得数', type: 'number' },
];

let tokenClient;
let accessToken = null;
let myTab = null; // ログインユーザーが本人入力可能なタブ名（該当なしならnull＝閲覧のみ）

window.addEventListener('load', () => {
  // file:// で直接開くとOAuthの許可オリジンに一致せず必ず認証エラーになるため、先に案内する
  if (location.protocol === 'file:') {
    document.getElementById('loginGate').innerHTML =
      '<p>このファイルを直接開いてもログインできません。<br>' +
      '下のリンクから公開ページを開いてください。</p>' +
      '<p><a href="https://masuda15k.github.io/kpi-dashboard/">https://masuda15k.github.io/kpi-dashboard/</a></p>';
    return;
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: onTokenReceived,
    error_callback: (err) => {
      showStatus('ログインできませんでした：' + (err?.type || '不明なエラー'), true);
    },
  });

  // Google標準の「Googleでログイン」ボタンではなく、シンプルなクリックボタンでトークンクライアントを起動する
  const btn = document.createElement('button');
  btn.textContent = 'Googleでログイン';
  btn.style.cssText = 'background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:14px;cursor:pointer;';
  btn.onclick = () => tokenClient.requestAccessToken({ prompt: 'consent' });
  document.getElementById('signInBtnHolder').appendChild(btn);
});

async function onTokenReceived(resp) {
  if (resp.error) {
    showStatus('ログインに失敗しました：' + resp.error, true);
    return;
  }
  accessToken = resp.access_token;
  document.getElementById('loginGate').style.display = 'none';

  try {
    const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` },
    });
    const user = await userRes.json();
    myTab = MEMBER_MAP[user.email] || null;
    document.getElementById('userBox').style.display = 'flex';
    document.getElementById('userName').textContent = myTab ? `${myTab}さん` : (user.email || 'ログイン中');
    document.getElementById('userAvatar').textContent = (myTab || user.email || '?').charAt(0);
  } catch (e) {
    showStatus('ユーザー情報の取得に失敗しました：' + e.message, true);
  }

  if (myTab) {
    await loadInputForm();
  } else {
    document.getElementById('viewerNote').style.display = 'block';
  }
  await loadDashboard();
}

document.getElementById('signOutBtn').addEventListener('click', () => {
  if (accessToken) {
    google.accounts.oauth2.revoke(accessToken, () => {});
  }
  accessToken = null;
  location.reload();
});

async function loadDashboard() {
  showStatus('読み込み中...', false);
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_RANGE)}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    renderDashboard(data.values || []);
    hideStatus();
  } catch (e) {
    showStatus('データの読み込みに失敗しました：' + e.message, true);
  }
}

// ── 本人入力フォーム（REQ-03）─────────────────────
async function loadInputForm() {
  const range = `'${myTab}'!B4:B17`;
  let currentValues = [];
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    currentValues = (data.values || []).map(r => (r && r[0] !== undefined) ? r[0] : '');
  } catch (e) {
    showStatus('入力フォームの読み込みに失敗しました：' + e.message, true);
    return;
  }

  const form = document.getElementById('inputForm');
  form.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = `${myTab}さんの入力フォーム`;
  form.appendChild(h);

  const inputs = [];
  MEMBER_MANUAL_CELLS.forEach((def, i) => {
    const row = document.createElement('div');
    row.className = 'field-row';
    const label = document.createElement('label');
    label.textContent = def.label;
    row.appendChild(label);

    const input = def.type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
    if (def.type === 'number') input.type = 'text'; // 全角数字入力もそのまま許容するためtext扱い
    input.value = currentValues[i] || '';
    input.dataset.key = def.key;
    row.appendChild(input);
    inputs.push(input);

    form.appendChild(row);
  });

  const saveBtn = document.createElement('button');
  saveBtn.id = 'saveBtn';
  saveBtn.textContent = '保存';
  saveBtn.onclick = () => saveInputForm(inputs, saveBtn);
  form.appendChild(saveBtn);

  const msg = document.createElement('div');
  msg.id = 'saveMsg';
  form.appendChild(msg);

  form.style.display = 'block';
}

async function saveInputForm(inputs, saveBtn) {
  const msg = document.getElementById('saveMsg');
  msg.textContent = '';
  msg.className = '';
  saveBtn.disabled = true;
  saveBtn.textContent = '保存中...';

  const values = inputs.map(inp => [inp.value]); // 失敗時もinputの値はそのまま残るので入力内容は失われない（REQ-05）

  try {
    const range = `'${myTab}'!B4:B17`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${accessToken}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ range, majorDimension: 'ROWS', values }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    msg.textContent = '保存しました';
    msg.className = 'ok';
  } catch (e) {
    msg.textContent = '保存に失敗しました（入力内容は消えていません）：' + e.message;
    msg.className = 'error';
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '保存';
  }
}

function showStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  el.style.display = 'block';
}
function hideStatus() {
  document.getElementById('statusMsg').style.display = 'none';
}

// Google Sheetsの生データを ■見出し ごとのセクションに切り分け、
// 見出しに応じた専用の描画（タイル・ファネル・カード等）に振り分ける。
// 未知の見出しは従来どおり表として描画するので、スプシ側にセクションが増えても壊れない。
function renderDashboard(rows) {
  const root = document.getElementById('dashboardRoot');
  root.innerHTML = '';
  root.style.display = 'block';

  let i = 0;
  // 先頭の非■行はヒーロー（タイトル＋期間＋四半期の経過率リング）として扱う
  if (rows[0] && rows[0][0] && !rows[0][0].startsWith('■')) {
    const hero = document.createElement('div');
    hero.className = 'hero';

    const text = document.createElement('div');
    text.className = 'hero-text';
    const h = document.createElement('h2');
    h.textContent = rows[0][0];
    text.appendChild(h);
    i = 1;

    let elapsedPct = null;
    if (rows[1] && rows[1][0] && !rows[1][0].startsWith('■')) {
      const p = document.createElement('div');
      p.className = 'period';
      // 「／」区切りの期間表記を項目ごとに分けて折り返しやすくする
      rows[1][0].split('／').forEach(part => {
        const span = document.createElement('span');
        span.textContent = part.trim();
        p.appendChild(span);
      });
      text.appendChild(p);
      i = 2;
      // 「Q(6/1〜8/31) 29/64営業日(45%)」のような表記から四半期の経過率を抜く
      const m = rows[1][0].match(/Q\([^)]*\)[^(]*\((\d+)%\)/);
      if (m) elapsedPct = Number(m[1]);
    }
    hero.appendChild(text);
    if (elapsedPct !== null) hero.appendChild(buildProgressRing(elapsedPct, '四半期 経過'));
    root.appendChild(hero);
  }

  // ■見出しごとにセクション分割（空行は区切りとして保持）
  const sections = [];
  let cur = null;
  for (; i < rows.length; i++) {
    const row = rows[i];
    const first = (row && row[0]) ? String(row[0]) : '';
    if (first.startsWith('■')) {
      cur = { title: first, rows: [] };
      sections.push(cur);
      continue;
    }
    if (!cur) continue;
    cur.rows.push(row && row.length ? row : []);
  }

  sections.forEach(sec => renderSection(root, sec));
}

function renderSection(root, sec) {
  const t = sec.title;
  // Sheets側の埋め込みグラフへの案内行は、HTML側で実グラフを描くため不要
  if (t.startsWith('■ グラフ（')) return;

  if (t.startsWith('■①') && !t.startsWith("■①'")) return renderGoalTiles(root, sec);
  if (t.startsWith('■②')) return renderFunnel(root, sec);
  if (t.startsWith('■③')) return renderMemberCards(root, sec);
  if (t.startsWith('■④')) return renderActions(root, sec);
  if (t.startsWith('■⑤')) return renderNotice(root, sec);
  if (t.startsWith('■ グラフ用データ')) return renderCharts(root, sec);
  return renderGenericTable(root, sec);
}

function addTitle(root, text) {
  const el = document.createElement('div');
  el.className = 'section-title';
  el.textContent = text;
  root.appendChild(el);
  return el;
}

function dataRowsOf(sec) { return sec.rows.filter(r => r && r.length); }

// ペース欄の絵文字から状態を判定する（色だけに意味を持たせず、絵文字＋文言もそのまま表示する）
function toneOf(text) {
  const s = String(text || '');
  if (s.includes('🔴')) return 'critical';
  if (s.includes('🟡')) return 'warning';
  if (s.includes('🟢')) return 'good';
  return '';
}
function toneColor(tone) {
  return tone === 'critical' ? 'var(--critical)'
       : tone === 'warning' ? 'var(--warning)'
       : tone === 'good' ? 'var(--good)'
       : 'var(--muted)';
}
function pct(v) {
  const n = parseFloat(String(v).replace('%', ''));
  return isFinite(n) ? n : null;
}
// ヒーロー用の円形プログレスリング（純SVG・外部ライブラリなし）
function buildProgressRing(percent, label) {
  const size = 76, stroke = 8, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(100, percent)) / 100);
  const wrap = document.createElement('div');
  wrap.className = 'hero-ring';
  wrap.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#fff" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="${size/2}" y="${size/2 + 6}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">${percent}%</text>
    </svg>
    <div class="ring-label"></div>`;
  wrap.querySelector('.ring-label').textContent = label;
  return wrap;
}

function makeBar(ratio, color) {
  const track = document.createElement('div');
  track.className = 'bar-track';
  const fill = document.createElement('div');
  fill.className = 'bar-fill';
  fill.style.width = Math.max(0, Math.min(100, ratio)) + '%';
  fill.style.background = color;
  track.appendChild(fill);
  return track;
}

// ■① ゴールとのギャップ → 指標ごとの大きな数字＋達成率バー
function renderGoalTiles(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  const header = rows[0] || [];
  const col = name => header.indexOf(name);
  const iResult = col('実績'), iMust = col('MUST'), iRate = col('達成率');
  const iPace = col('ペース'), iLand = col('着地見込み'), iDiff = col('過不足'), iNote = col('補足');

  const grid = document.createElement('div');
  grid.className = 'tile-grid';

  rows.slice(1).forEach(r => {
    const tone = toneOf(r[iPace]);
    const rate = pct(r[iRate]);
    const tile = document.createElement('div');
    tile.className = 'tile';

    const head = document.createElement('div');
    head.className = 'tile-head';
    const name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = r[0];
    const status = document.createElement('span');
    status.className = 'tile-status ' + tone;
    status.textContent = r[iPace] || '';
    head.append(name, status);

    const val = document.createElement('div');
    val.className = 'tile-value';
    val.textContent = r[iResult] || '';
    if (iMust >= 0 && r[iMust]) {
      const of = document.createElement('span');
      of.className = 'of';
      of.textContent = `/ ${r[iMust]}（MUST）`;
      val.appendChild(of);
    }

    tile.append(head, val);
    if (rate !== null) tile.appendChild(makeBar(rate, toneColor(tone)));

    const meta = document.createElement('div');
    meta.className = 'tile-meta';
    if (rate !== null) {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = `達成率 ${r[iRate]}`;
      meta.appendChild(s);
    }
    if (iDiff >= 0 && r[iDiff]) {
      const s = document.createElement('span');
      const behind = String(r[iDiff]).trim().startsWith('-');
      s.className = 'chip ' + (behind ? 'delta-behind' : 'delta-ahead');
      s.textContent = r[iDiff];
      meta.appendChild(s);
    }
    if (iLand >= 0 && r[iLand]) {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = `着地見込み ${r[iLand]}`;
      meta.appendChild(s);
    }
    tile.appendChild(meta);

    if (iNote >= 0 && r[iNote]) {
      const note = document.createElement('div');
      note.className = 'tile-note';
      note.textContent = r[iNote];
      tile.appendChild(note);
    }
    grid.appendChild(tile);
  });

  root.appendChild(grid);
}

// ■② ファネル → 件数と転換率を横並びで。パイプライン在庫行はそのまま表で残す
function renderFunnel(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  const header = rows[0] || [];
  const values = rows[1] || [];

  if (header.length && values.length) {
    const card = document.createElement('div');
    card.className = 'funnel-card';
    const wrap = document.createElement('div');
    wrap.className = 'funnel';
    // 段階の件数（偶数インデックス）の最大値を基準に、各段階のバー幅を件数に比例させる（漏斗の見た目）
    const stepVals = header.map((_, idx) => idx % 2 === 0 ? Number(values[idx]) || 0 : null).filter(v => v !== null);
    const maxStep = Math.max(1, ...stepVals);
    header.forEach((label, idx) => {
      const el = document.createElement('div');
      if (idx % 2 === 0) {
        const v = Number(values[idx]) || 0;
        el.className = 'funnel-step';
        el.innerHTML = `<div class="n"></div><div class="bar"></div><div class="l"></div>`;
        el.querySelector('.n').textContent = values[idx] ?? '';
        el.querySelector('.bar').style.width = Math.max(20, (v / maxStep) * 100) + '%';
        el.querySelector('.bar').style.margin = '8px auto 6px';
        el.querySelector('.l').textContent = label;
      } else {
        el.className = 'funnel-arrow';
        el.innerHTML = `<span class="rate"></span><span class="arrow-ico">→</span>`;
        el.querySelector('.rate').textContent = values[idx] ?? '';
        el.title = label;
      }
      wrap.appendChild(el);
    });
    card.appendChild(wrap);
    root.appendChild(card);
  }

  const rest = rows.slice(2);
  if (rest.length) root.appendChild(buildTable(rest));
}

// ■③ メンバー別ペース → 1人1カード。実績/目標を進捗バーで
function renderMemberCards(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  const header = rows[0] || [];
  const members = header.slice(1);
  const byLabel = {};
  rows.slice(1).forEach(r => { byLabel[r[0]] = r.slice(1); });

  const grid = document.createElement('div');
  grid.className = 'member-grid';

  members.forEach((m, mi) => {
    const card = document.createElement('div');
    card.className = 'member-card';

    const paceText = (byLabel['ペース'] || [])[mi] || '';
    const tone = toneOf(paceText) || 'good';
    const head = document.createElement('div');
    head.className = 'member-head';
    const avatar = document.createElement('span');
    avatar.className = 'member-avatar';
    avatar.textContent = m.charAt(0);
    avatar.style.background = toneColor(tone);
    const nameEl = document.createElement('span');
    nameEl.className = 'member-name';
    nameEl.textContent = m;
    const paceEl = document.createElement('span');
    paceEl.className = 'member-pace ' + tone;
    paceEl.textContent = paceText;
    head.append(avatar, nameEl, paceEl);
    card.appendChild(head);

    // 「実績 / 目標」形式の行だけ進捗バーにする。
    // 「今週 商談/P2」のように見出し自体が "/" を含む行は別々の2指標を並べたものなので除外する。
    const isProgressRow = (label, cell) =>
      !label.includes('/') && /^\s*\d+\s*\/\s*\d+\s*$/.test(cell);

    Object.keys(byLabel).forEach(label => {
      if (label === 'ペース') return;
      const cell = String(byLabel[label][mi] ?? '');
      if (!isProgressRow(label, cell)) return;
      const m2 = cell.match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/);
      const [, doneStr, targetStr] = m2;
      const done = Number(doneStr), target = Number(targetStr);
      const ratio = target > 0 ? (done / target) * 100 : 0;

      const line = document.createElement('div');
      line.className = 'metric-line';
      const row = document.createElement('div');
      row.className = 'row';
      const l = document.createElement('span');
      l.textContent = label;
      const v = document.createElement('span');
      v.innerHTML = `<b></b> / ${target}`;
      v.querySelector('b').textContent = done;
      row.append(l, v);
      line.appendChild(row);
      line.appendChild(makeBar(ratio, toneColor(toneOf(paceText)) ));
      card.appendChild(line);
    });

    // 残りの自由書式の行はカード下部にまとめる
    const foot = document.createElement('div');
    foot.className = 'member-foot';
    let hasFoot = false;
    Object.keys(byLabel).forEach(label => {
      if (label === 'ペース') return;
      const cell = String(byLabel[label][mi] ?? '');
      if (isProgressRow(label, cell)) return; // 上で進捗バーにした行は重複表示しない
      const s = document.createElement('span');
      s.innerHTML = `${label} <b></b>`;
      s.querySelector('b').textContent = cell;
      foot.appendChild(s);
      hasFoot = true;
    });
    if (hasFoot) card.appendChild(foot);

    grid.appendChild(card);
  });

  root.appendChild(grid);
}

const TONE_ICON = { critical: '🔴', warning: '🟡', good: '🟢' };

// ■④ 今週のアクション → 重要度で色分けしたリスト（絵文字はアイコンバッジに変換し、本文からは取り除く）
function renderActions(root, sec) {
  addTitle(root, sec.title);
  const list = document.createElement('div');
  list.className = 'action-list';
  dataRowsOf(sec).forEach(r => {
    // 先頭が連番のみの列なら本文は2列目
    const text = (r.length > 1 && /^\d+$/.test(String(r[0]).trim())) ? r.slice(1).join(' ') : r.join(' ');
    const tone = toneOf(text) || 'good';
    const item = document.createElement('div');
    item.className = 'action-item ' + tone;
    const ico = document.createElement('span');
    ico.className = 'action-ico';
    ico.textContent = TONE_ICON[tone];
    const body = document.createElement('span');
    body.className = 'action-text';
    body.textContent = text.replace(/[🔴🟡🟢]\s*/g, '');
    item.append(ico, body);
    list.appendChild(item);
  });
  root.appendChild(list);
}

// ■⑤ データ品質サマリー → 注意バナー
function renderNotice(root, sec) {
  addTitle(root, sec.title);
  dataRowsOf(sec).forEach(r => {
    const el = document.createElement('div');
    el.className = 'notice';
    const ico = document.createElement('span');
    ico.textContent = '⚠️';
    const body = document.createElement('span');
    body.textContent = r.join(' ').replace(/^⚠\s*/, '');
    el.append(ico, body);
    root.appendChild(el);
  });
}

// ■ グラフ用データ → 空行区切りのグループごとに棒グラフ化
function renderCharts(root, sec) {
  addTitle(root, '■⑥ グラフ');
  let group = [];
  const flush = () => {
    if (group.length >= 2) root.appendChild(buildGroupedBarChart(group[0], group.slice(1)));
    group = [];
  };
  sec.rows.forEach(r => {
    if (!r || !r.length) { flush(); return; }
    group.push(r);
  });
  flush();
}

function renderGenericTable(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  if (rows.length) root.appendChild(buildTable(rows));
}

function buildTable(rows) {
  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const table = document.createElement('table');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    const looksLikeHeader = row.every(cell => !/[0-9]/.test(String(cell)));
    if (looksLikeHeader) tr.className = 'header-row';
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  scroll.appendChild(table);
  return scroll;
}

function escapeXml(s) {
  return String(s).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));
}

// header: ['ステージ','件数'] のような [カテゴリ列名, 系列名...]。rows: [カテゴリ, 値...][]
// 系列色はdataviz skillのカテゴリカルパレット固定順（slot1 blue, slot2 orange）を使用。3系列以上は現状想定していない。
const SERIES_COLORS = ['#2a78d6', '#eb6834'];
function buildGroupedBarChart(header, dataRows) {
  const seriesNames = header.slice(1);
  const categories = dataRows.map(r => r[0]);
  const seriesData = seriesNames.map((_, si) => dataRows.map(r => Number(r[si + 1]) || 0));
  const maxVal = Math.max(1, ...seriesData.flat());

  const width = 640, plotHeight = 140, catGap = 14;
  const groupWidth = (width - catGap * (categories.length + 1)) / categories.length;
  const barGap = seriesNames.length > 1 ? 3 : 0;
  const barWidth = Math.min(32, (groupWidth - barGap * (seriesNames.length - 1)) / seriesNames.length);

  let svg = `<svg viewBox="0 0 ${width} ${plotHeight + 24}" width="100%" style="max-width:${width}px;display:block;">`;
  // 目盛りの補助線（0%・50%・100%）
  [0.25, 0.5, 0.75].forEach(f => {
    const y = plotHeight - (plotHeight - 20) * f;
    svg += `<line x1="0" y1="${y.toFixed(1)}" x2="${width}" y2="${y.toFixed(1)}" class="chart-gridline"/>`;
  });
  svg += `<line x1="0" y1="${plotHeight}" x2="${width}" y2="${plotHeight}" stroke="#c3c2b7" stroke-width="1"/>`;

  categories.forEach((cat, ci) => {
    const groupX = catGap + ci * (groupWidth + catGap);
    seriesNames.forEach((name, si) => {
      const val = seriesData[si][ci];
      const h = maxVal ? (val / maxVal) * (plotHeight - 20) : 0;
      const x = groupX + si * (barWidth + barGap);
      const y = plotHeight - h;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${SERIES_COLORS[si]}"><title>${escapeXml(name)} ${escapeXml(cat)}: ${val}</title></rect>`;
      svg += `<text class="chart-value-label" x="${(x + barWidth / 2).toFixed(1)}" y="${Math.max(10, y - 4).toFixed(1)}" text-anchor="middle">${val}</text>`;
    });
    svg += `<text class="chart-bar-label" x="${(groupX + groupWidth / 2).toFixed(1)}" y="${plotHeight + 16}" text-anchor="middle">${escapeXml(cat)}</text>`;
  });
  svg += `</svg>`;

  const card = document.createElement('div');
  card.className = 'chart-card';
  if (seriesNames.length > 1) {
    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    legend.innerHTML = seriesNames.map((name, i) =>
      `<span><span class="swatch" style="background:${SERIES_COLORS[i]}"></span>${escapeXml(name)}</span>`
    ).join('');
    card.appendChild(legend);
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = svg;
  card.appendChild(wrap.firstChild);
  return card;
}
</script>

</body>
</html>
