<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1係 KPIダッシュボード</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    color-scheme: dark;
    /* 識学の紺#0B1644を土台に、ほぼ黒に近いところまで沈めた背景。赤は最小限、金は使わない */
    --bg: #0a0d16;
    --card: #12151f;
    --card-2: #171a26;
    --border: rgba(255,255,255,.08);
    --text: #eef0f4;
    --muted: #8a8e9c;
    --muted-2: #5c606d;
    --accent: #aab4e8;
    --accent-dark: #7b86c4;
    --accent-tint: rgba(170,180,232,.14);
    --good: #4fae82;       --good-tint: rgba(79,174,130,.13);      --good-border: rgba(79,174,130,.3);
    --warning: #c9a24a;    --warning-tint: rgba(201,162,74,.13);   --warning-border: rgba(201,162,74,.3);
    --critical: #c85c5c;   --critical-tint: rgba(200,92,92,.14);   --critical-border: rgba(200,92,92,.32);
    --track: rgba(255,255,255,.08);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 16px 32px -12px rgba(0,0,0,.55);
    /* authkit.comのログインカードを分解して移植：際立たせるのは塗りではなく、
       内側の細いハイライト＋淡いグロー＋外側の影を重ねた「縁の質感」 */
    --shadow-glass: 0 1px 1px 0 rgba(238,240,244,.12) inset,
                    0 24px 48px 0 rgba(170,180,232,.05) inset,
                    0 16px 32px 0 rgba(0,0,0,.35);
    --shadow-glass-hover: 0 1px 1px 0 rgba(238,240,244,.16) inset,
                          0 24px 48px 0 rgba(170,180,232,.08) inset,
                          0 24px 48px -8px rgba(0,0,0,.5);
    --radius: 16px;
    --display-font: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
    min-height: 100vh;
  }
  ::selection { background: var(--accent-tint); }

  /* ── 背景：識学カラー（薄紫・緑・金）だけを使った、はっきり動く光の膨らみ ── */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-glow span {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .18;
    will-change: transform;
  }
  .bg-glow .g1 { width: 480px; height: 480px; background: var(--accent); top: -160px; left: -120px; animation: bgDrift1 16s ease-in-out infinite; }
  .bg-glow .g2 { width: 420px; height: 420px; background: var(--good); top: 42%; right: -160px; animation: bgDrift2 20s ease-in-out infinite; }
  .bg-glow .g3 { width: 360px; height: 360px; background: var(--warning); bottom: -140px; left: 18%; opacity: .12; animation: bgDrift3 24s ease-in-out infinite; }
  @keyframes bgDrift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px, 50px) scale(1.15); } }
  @keyframes bgDrift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px, 40px) scale(1.1); } }
  @keyframes bgDrift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px, -40px) scale(1.18); } }
  @media (prefers-reduced-motion: reduce) {
    .bg-glow span { animation: none; }
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(10,13,22,.72);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 400;
    font-family: var(--display-font);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .01em; color: var(--text); }
  #userBox { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-tint); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  /* 間（ま）：余白を広く取る。左右の広い余白そのものが装飾になる */
  main { max-width: 900px; margin: 72px auto 140px; padding: 0 28px; position: relative; z-index: 1; }

  #loginGate {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 96px 32px;
    text-align: center;
  }
  #loginGate .gate-mark {
    width: 52px; height: 52px;
    margin: 0 auto 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 400;
    font-family: var(--display-font);
  }
  #loginGate h2 { font-family: var(--display-font); font-size: 22px; font-weight: 400; letter-spacing: 0; margin: 0 0 14px; }
  #loginGate p { color: var(--muted); margin-bottom: 32px; line-height: 1.8; font-size: 13px; }
  #statusMsg { text-align: center; color: var(--muted); margin: 24px 0; font-size: 13px; }
  #statusMsg.error { color: var(--critical); }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    margin: 56px 0 18px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    /* 識学の組織図が「同格を水平線で揃える」作法を借りた、細い基準線 */
    content: '';
    display: inline-block;
    width: 20px; height: 1px;
    background: var(--muted-2);
  }

  /* ── カード出現：読み込み時に一括ではなく、スクロールして画面に入ってきた瞬間に浮き上がる ── */
  .reveal-pending {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  .reveal-pending.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal-pending { transition: none; opacity: 1; transform: none; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 13px;
    margin-bottom: 4px;
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  tr.header-row td {
    font-weight: 700;
    background: var(--card-2);
    color: var(--muted);
    font-variant-numeric: normal;
  }

  #signInBtnHolder { display: flex; justify-content: center; }
  #signInBtnHolder button {
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  #signInBtnHolder button:hover { opacity: .85; }

  button.secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  button.secondary:hover { background: var(--bg); }

  /* 報告タブごとに入力カードが出るのでIDではなくクラスで指定する */
  .input-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 20px 22px;
    margin-bottom: 28px;
  }
  .input-card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 700; }
  .field-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .field-row:last-of-type { border-bottom: none; }
  .field-row label { flex: 0 0 260px; font-size: 13px; color: var(--muted); }
  .field-row input, .field-row textarea {
    flex: 1;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .field-row input:focus, .field-row textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field-row textarea { resize: vertical; min-height: 44px; }
  .save-btn {
    margin-top: 16px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .save-btn:hover:not(:disabled) { opacity: .85; }
  .save-btn:disabled { opacity: 0.55; cursor: default; box-shadow: none; }
  .save-msg { font-size: 13px; margin-top: 10px; font-weight: 600; }
  .save-msg.ok { color: var(--good); }
  .save-msg.error { color: var(--critical); }

  .viewer-note {
    font-size: 13px;
    color: var(--muted);
    background: var(--accent-tint);
    border: 1px solid #d9dcfb;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
  }

  .chart-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 22px 24px 18px;
    margin-bottom: 12px;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .chart-legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .chart-bar-label { font-size: 11px; fill: var(--muted); }
  .chart-value-label { font-size: 11px; fill: var(--text); font-weight: 700; }
  .chart-card rect { transition: opacity .1s; }
  .chart-card rect:hover { opacity: .8; }
  .chart-gridline { stroke: var(--border); stroke-width: 1; }

  /* ── ヒーロー：箱を持たず、背景に静かに溶け込ませる。主張するのは数字と余白だけ ── */
  .hero {
    position: relative;
    padding: 8px 0 56px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .hero-text h2 {
    font-family: var(--display-font);
    font-size: 32px;
    margin: 0 0 22px;
    font-weight: 400;
    letter-spacing: .01em;
    line-height: 1.45;
    color: var(--text);
  }
  .hero .period {
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    color: var(--muted);
  }
  .hero-ring { flex: 0 0 auto; text-align: center; }
  .hero-ring svg { display: block; }
  .hero-ring .ring-label { font-size: 11px; opacity: .68; margin-top: 8px; font-weight: 400; letter-spacing: .04em; }

  /* ── 目標ギャップのタイル ── */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 8px;
  }
  .tile {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 24px 26px 26px;
    transition: box-shadow .25s cubic-bezier(.16,1,.3,1), transform .25s cubic-bezier(.16,1,.3,1);
  }
  .tile:hover { box-shadow: var(--shadow-glass-hover); transform: translateY(-3px); }
  .tile-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tile-name { font-size: 14px; font-weight: 700; color: var(--muted); }
  .tile-status {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    padding: 4px 12px 4px 9px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tile-status::before, .member-pace::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
  }
  /* 淡いtintではなく、はっきり読める実色バッジにする（視認性優先） */
  .tile-status.good { background: var(--good); color: #06281a; }
  .tile-status.warning { background: var(--warning); color: #2c2308; }
  .tile-status.critical { background: var(--critical); color: #2a0b0b; }
  .tile-value {
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .tile-value .of {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted-2);
    margin-left: 6px;
  }
  .bar-track {
    height: 9px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 10px;
  }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.16,1,.3,1); }

  /* ── 位置：まず塗りバーで「どれだけ埋まっているか」を瞬時に見せ、
     その上に実績の点とMUSTの目印を重ねて「正確な位置」も示す（視認性優先） ── */
  .pos-track {
    position: relative;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    margin: 22px 4px 20px;
    overflow: visible;
  }
  .pos-fill {
    position: absolute;
    inset: 0;
    right: auto;
    border-radius: 999px;
    transition: width .9s cubic-bezier(.16,1,.3,1);
  }
  .pos-dot {
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 3px var(--bg);
    transition: left .9s cubic-bezier(.16,1,.3,1);
  }
  .pos-tick {
    position: absolute;
    top: 50%;
    width: 2px; height: 20px;
    background: var(--text);
    opacity: .6;
    transform: translate(-50%, -50%);
  }
  .pos-tick::after {
    content: attr(data-label);
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .pos-dot::after {
    content: attr(data-label);
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
  }
  .tile-meta {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: var(--bg);
    border-radius: 999px;
    padding: 4px 11px;
    white-space: nowrap;
  }
  .chip.delta-behind { background: var(--critical-tint); color: var(--critical); font-weight: 700; }
  .chip.delta-ahead { background: var(--good-tint); color: var(--good); font-weight: 700; }
  .tile-note { font-size: 12px; color: var(--muted-2); margin-top: 8px; line-height: 1.5; }

  /* ── ファネル ── */
  .funnel-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 28px 30px 22px;
    margin-bottom: 8px;
  }
  .funnel {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 4px 2px;
    row-gap: 16px;
  }
  .funnel-step { text-align: center; flex: 1 1 56px; min-width: 56px; }
  .funnel-step .n { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .funnel-step .bar {
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    margin: 8px 0 6px;
  }
  .funnel-step .l { font-size: 11px; color: var(--muted); }
  .funnel-arrow {
    flex: 0 0 auto;
    align-self: center;
    text-align: center;
    padding-bottom: 22px;
  }
  .funnel-arrow .rate {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    background: var(--accent-tint); color: var(--accent-dark);
    border-radius: 999px; padding: 2px 8px;
    margin-bottom: 2px;
  }
  .funnel-arrow .arrow-ico { display: block; color: var(--muted-2); font-size: 12px; }

  /* ── メンバーカード ── */
  /* ── 同格を水平線で揃える：識学の組織図の作法をそのまま借りる。全員が同じ基準線の上に立つ ── */
  .rank-strip {
    position: relative;
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 2px;
    background: var(--muted-2);
    opacity: .4;
    margin: 8px 24px 40px;
  }
  .rank-node {
    position: relative;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .rank-node::after {
    content: attr(data-label);
    position: absolute;
    top: 46px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .member-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    margin-bottom: 8px;
  }
  .member-card {
    background: var(--card);
    border: 1px solid rgba(20,22,31,.055);
    border-radius: var(--radius);
    box-shadow: var(--shadow-glass);
    padding: 22px 24px;
    transition: box-shadow .25s cubic-bezier(.16,1,.3,1), transform .25s cubic-bezier(.16,1,.3,1);
  }
  .member-card:hover { box-shadow: var(--shadow-glass-hover); transform: translateY(-3px); }
  .member-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .member-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    flex: 0 0 auto;
  }
  .member-name { font-size: 14px; font-weight: 700; flex: 1; }
  .member-pace {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px 3px 7px; border-radius: 999px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .member-pace.good { background: var(--good-tint); color: var(--good); }
  .member-pace.warning { background: var(--warning-tint); color: var(--warning); }
  .member-pace.critical { background: var(--critical-tint); color: var(--critical); }
  .metric-line { margin-top: 9px; }
  .metric-line .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .metric-line .row b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-line .bar-track { height: 6px; margin: 0; }
  .member-foot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 10px;
  }
  .member-foot b { color: var(--text); }

  /* ── アクション・警告 ── */
  .action-list { margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  .action-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 13px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: var(--shadow-glass);
  }
  .action-ico {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }

<script>
// ── 設定 ──────────────────────────────────────────
const CLIENT_ID = '315650091875-4b15pp0ue46gp6b8e2uitksc5ea5h6g6.apps.googleusercontent.com';
const SPREADSHEET_ID = '1qHftqur_IDqjc97VnfMopSnMeQj6z5U-m5x68O1Ahkw';
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';

// 参照するスプシのタブ名。範囲を付けずタブ名だけ指定＝実データのある範囲を自動取得（列が増えても切れない）
const SHEET_DASHBOARD = 'ダッシュボード'; // 1係全体のダッシュボード
const SHEET_REPORT    = '報告';           // 1係全体の日報・週報・月報（増田さんの入力先）
const SHEET_ANALYSIS  = '分析';           // 1係全体の分析（架電・商談分析を含む）
const MEMBERS = ['菅原', '丸野', '江波戸', '飯山']; // 個人タブを持つメンバー（表示順）

// ログイン中のメールアドレス → 本人が書き込めるタブ（tab）と、画面表示用の呼び方（label）。
// tabとlabelが異なるのは増田さんだけ（書き込み先は「報告」タブだが、本人は「報告さん」ではないため）
const MEMBER_MAP = {
  'kazumasasugawara@shikigaku.com': { tab: '菅原', label: '菅原' },
  'kayomaruno@shikigaku.com':       { tab: '丸野', label: '丸野' },
  'wataruebato@shikigaku.com':      { tab: '江波戸', label: '江波戸' },
  'takahiroiiyama@shikigaku.com':   { tab: '飯山', label: '飯山' },
  'koumeimasuda@shikigaku.com':     { tab: '報告', label: '増田' },
};

// kpi-v3-core.js の MEMBER_MANUAL_CELLS と1対1で対応（B4:B17・この順序のまま）
const MEMBER_MANUAL_CELLS = [
  { key: 'nextDayCreate', label: '【日次】次の約束：商談作成数', type: 'number' },
  { key: 'nextDayYotei',  label: '【日次】次の約束：商談予定数', type: 'number' },
  { key: 'nextDayShadan', label: '【日次】次の約束：商談実施数', type: 'number' },
  { key: 'nextDayP2',     label: '【日次】次の約束：コンサル部提案提供数', type: 'number' },
  { key: 'nextDayP3',     label: '【日次】次の約束：提案済数', type: 'number' },
  { key: 'nextDayClose',  label: '【日次】次の約束：新規獲得数', type: 'number' },
  { key: 'weeklyReason',  label: '【週報】不足の理由', type: 'textarea' },
  { key: 'weeklyAction',  label: '【週報】行動変化', type: 'textarea' },
  { key: 'nextWeekCreate', label: '【週報】次週の約束：商談作成数', type: 'number' },
  { key: 'nextWeekYotei',  label: '【週報】次週の約束：商談予定数', type: 'number' },
  { key: 'nextWeekShadan', label: '【週報】次週の約束：商談実施数', type: 'number' },
  { key: 'nextWeekP2',     label: '【週報】次週の約束：コンサル部提案提供数', type: 'number' },
  { key: 'nextWeekP3',     label: '【週報】次週の約束：提案済', type: 'number' },
  { key: 'nextWeekClose',  label: '【週報】次週の約束：新規獲得数', type: 'number' },
];

// 「報告」タブ（係全体の日報・週報・月報／増田さん用）の手入力セル。B4:B15・この順序のまま。
// keyは kpi-v3-core.js の REPORT_MANUAL_CELLS と同名に揃えてある（スプシ側は位置で読むがラベル対応の追跡用）
const REPORT_MANUAL_CELLS = [
  { key: 'nextDayShadan',      label: '【日次】次営業日の約束：商談実施数', type: 'number' },
  { key: 'nextDayShadanPlan',  label: '【日次】次営業日の約束：商談予定数（分かれば）', type: 'number' },
  { key: 'nextDayP2',          label: '【日次】次営業日の約束：P2提案獲得数', type: 'number' },
  { key: 'weeklyReasonS',      label: '【週報】不足の理由：商談実施数', type: 'textarea' },
  { key: 'weeklyReasonP2',     label: '【週報】不足の理由：提案獲得', type: 'textarea' },
  { key: 'weeklyReasonC',      label: '【週報】不足の理由：新規', type: 'textarea' },
  { key: 'weeklyAction',       label: '【週報】行動変化', type: 'textarea' },
  { key: 'nextWeekShadan',     label: '【週報】次週の目標：商談実施数（空欄なら自動按分）', type: 'number' },
  { key: 'nextWeekShadanPlan', label: '【週報】次週の目標：商談予定数', type: 'number' },
  { key: 'nextWeekP2',         label: '【週報】次週の目標：P2移行数（空欄なら自動按分）', type: 'number' },
  { key: 'nextWeekClose',      label: '【週報】次週の目標：新規獲得件数（空欄なら自動按分）', type: 'number' },
  { key: 'monthlyAction',      label: '【月報】行動変化', type: 'textarea' },
];

// タブ名からその手入力セル定義を引く（B4始まりなので、行の終端は 3+件数 で自動的に決まる）
function manualCellsFor(tab) { return tab === SHEET_REPORT ? REPORT_MANUAL_CELLS : MEMBER_MANUAL_CELLS; }

// 入力欄をどの報告タブに出すかは、ラベルの【】接頭辞から決める（行番号をハードコードしない）
function groupOfLabel(label) {
  if (label.startsWith('【日次】')) return 'daily';
  if (label.startsWith('【週報】')) return 'weekly';
  if (label.startsWith('【月報】')) return 'monthly';
  return 'other';
}
// 指定グループの入力欄と、そのスプシ上の連続範囲（B列）をまとめて返す
function inputGroupFor(tab, group) {
  const cells = manualCellsFor(tab);
  const picked = [];
  cells.forEach((def, i) => { if (groupOfLabel(def.label) === group) picked.push({ def, row: 4 + i }); });
  if (!picked.length) return null;
  const firstRow = picked[0].row, lastRow = picked[picked.length - 1].row;
  return { picked, range: `'${tab}'!B${firstRow}:B${lastRow}` };
}

const AUTO_SIGNIN_KEY = 'kpiDashboardAutoSignIn'; // 「前回サインイン済み」だけを覚える（トークン自体は保存しない）
const REFRESH_MARGIN_SEC = 300; // トークン期限の5分前に、画面を止めずに裏側だけで更新する

let tokenClient;
let accessToken = null;
let myProfile = null; // ログインユーザーの{tab, label}（該当なしならnull＝閲覧のみ）。tabがSheetsの書き込み先、labelが画面表示名
let hasCompletedSignIn = false; // 初回サインインが完了した後は、以降のトークン更新で画面を再描画しない
let isAutoSignInAttempt = false; // 再訪問時の自動サインイン試行中フラグ（失敗してもエラー表示しない）
let refreshTimer = null;

// ── 画面の状態（L1／L2／L3）──
let selectedMember = null;     // null＝1係全体。それ以外はメンバー名（＝スプシのタブ名）
let activeTab = 'dashboard';   // L2
let activeSub = 'general';     // L3（分析タブ内）
const sheetCache = {};         // タブ名 → 行配列。一度読んだタブは再取得しない

// いま表示している対象のスプシタブ名。1係全体のときは入力先＝「報告」
function currentSheet() { return selectedMember || SHEET_REPORT; }
// いま表示している対象が自分の書き込み先かどうか（＝入力を許可してよいか。REQ-04）
function canEditCurrent() { return !!myProfile && myProfile.tab === currentSheet(); }

window.addEventListener('load', () => {
  // file:// で直接開くとOAuthの許可オリジンに一致せず必ず認証エラーになるため、先に案内する
  if (location.protocol === 'file:') {
    document.getElementById('loginGate').innerHTML =
      '<p>このファイルを直接開いてもログインできません。<br>' +
      '下のリンクから公開ページを開いてください。</p>' +
      '<p><a href="https://masuda15k.github.io/kpi-dashboard/">https://masuda15k.github.io/kpi-dashboard/</a></p>';
    return;
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: handleTokenResponse,
    error_callback: (err) => {
      if (hasCompletedSignIn) {
        // 裏側での自動更新に失敗＝Google側のセッションが切れている。ログイン画面に戻す
        resetToSignedOut();
        showStatus('セッションの有効期限が切れました。再度ログインしてください。', true);
      } else if (isAutoSignInAttempt) {
        // 再訪問時の自動サインインが失敗しただけなので、静かにボタン操作に戻す
        isAutoSignInAttempt = false;
        hideStatus();
      } else {
        showStatus('ログインできませんでした：' + (err?.type || '不明なエラー'), true);
      }
    },
  });

  // Google標準の「Googleでログイン」ボタンではなく、シンプルなクリックボタンでトークンクライアントを起動する
  const btn = document.createElement('button');
  btn.textContent = 'Googleでログイン';
  btn.onclick = () => tokenClient.requestAccessToken({ prompt: 'consent' });
  document.getElementById('signInBtnHolder').appendChild(btn);

  // 前回サインイン済みのブラウザなら、ボタン操作なしで静かに再認証を試みる（Google側のセッションが生きていれば即ログイン）
  if (localStorage.getItem(AUTO_SIGNIN_KEY) === '1') {
    isAutoSignInAttempt = true;
    showStatus('自動ログイン中...', false);
    tokenClient.requestAccessToken({ prompt: '' });
  }
});

function handleTokenResponse(resp) {
  isAutoSignInAttempt = false;
  if (resp.error) {
    showStatus('ログインに失敗しました：' + resp.error, true);
    return;
  }
  accessToken = resp.access_token;
  localStorage.setItem(AUTO_SIGNIN_KEY, '1');
  scheduleTokenRefresh(resp.expires_in);
  if (!hasCompletedSignIn) {
    hasCompletedSignIn = true;
    completeSignIn();
  } else {
    hideStatus(); // 裏側での更新完了。画面はそのまま
  }
}

// 期限が切れる前にユーザー操作なしでトークンを更新し続ける（REQ: トークン自動リフレッシュ）
function scheduleTokenRefresh(expiresInSec) {
  clearTimeout(refreshTimer);
  const delayMs = Math.max(10, (Number(expiresInSec) || 3600) - REFRESH_MARGIN_SEC) * 1000;
  refreshTimer = setTimeout(() => {
    tokenClient.requestAccessToken({ prompt: '' });
  }, delayMs);
}

function resetToSignedOut() {
  accessToken = null;
  hasCompletedSignIn = false;
  clearTimeout(refreshTimer);
  localStorage.removeItem(AUTO_SIGNIN_KEY);
  document.getElementById('loginGate').style.display = 'block';
  document.getElementById('memberBar').style.display = 'none';
  document.getElementById('tabNav').style.display = 'none';
  document.getElementById('userBox').style.display = 'none';
}

async function completeSignIn() {
  document.getElementById('loginGate').style.display = 'none';

  try {
    const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` },
    });
    const user = await userRes.json();
    myProfile = MEMBER_MAP[user.email] || null;
    document.getElementById('userBox').style.display = 'flex';
    document.getElementById('userName').textContent = myProfile ? `${myProfile.label}さん` : (user.email || 'ログイン中');
    document.getElementById('userAvatar').textContent = (myProfile?.label || user.email || '?').charAt(0);
  } catch (e) {
    showStatus('ユーザー情報の取得に失敗しました：' + e.message, true);
  }

  // ログイン直後は自分の担当分から見せる（メンバーなら自分、増田さん・その他は1係全体）
  if (myProfile && myProfile.tab !== SHEET_REPORT) selectedMember = myProfile.tab;
  syncMemberBar();

  document.getElementById('memberBar').style.display = 'flex';
  document.getElementById('tabNav').style.display = 'flex';
  await renderCurrentView();
}

// ── データ取得 ──────────────────────────────────────
// 必要なタブをまとめて1リクエストで取る（batchGet）。一度読んだタブはキャッシュから返す
async function fetchSheets(tabs) {
  const need = tabs.filter(t => !(t in sheetCache));
  if (need.length) {
    const qs = need.map(t => 'ranges=' + encodeURIComponent(t)).join('&');
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchGet?${qs}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    (data.valueRanges || []).forEach((vr, i) => { sheetCache[need[i]] = vr.values || []; });
    need.forEach(t => { if (!(t in sheetCache)) sheetCache[t] = []; });
  }
  const out = {};
  tabs.forEach(t => { out[t] = sheetCache[t] || []; });
  return out;
}

// 1行目＝タイトル、2行目＝期間、以降は ■/◆ 見出しごとのセクションに切り分ける。
// 見出しの行番号はメンバーごとにズレるので、必ず見出し文字列で判定する。
function parseSheet(rows) {
  const isHead = s => /^[■◆]/.test(s);
  let i = 0, title = '', period = '', elapsedPct = null;
  if (rows[0] && rows[0][0] && !isHead(String(rows[0][0]))) { title = String(rows[0][0]); i = 1; }
  if (rows[1] && rows[1][0] && !isHead(String(rows[1][0]))) {
    period = String(rows[1][0]);
    i = 2;
    // 「Q(6/1〜8/31) 29/64営業日(45%)」のような表記から四半期の経過率を抜く
    const m = period.match(/Q\([^)]*\)[^(]*\((\d+)%\)/);
    if (m) elapsedPct = Number(m[1]);
  }
  const sections = [];
  let cur = null;
  for (; i < rows.length; i++) {
    const row = rows[i];
    const first = (row && row[0]) ? String(row[0]) : '';
    if (isHead(first)) { cur = { title: first, rows: [] }; sections.push(cur); continue; }
    if (!cur) continue;
    cur.rows.push(row && row.length ? row : []);
  }
  return { title, period, elapsedPct, sections };
}

function findSection(parsed, pred) { return parsed.sections.find(s => pred(s.title)); }

// 手入力セルの現在値。タブ全体を既に取得しているので、ここで追加のAPIは叩かない
function inputValuesFrom(parsed) {
  const sec = findSection(parsed, t => t.startsWith('■ 手入力セル'));
  if (!sec) return [];
  return sec.rows.map(r => (r && r[1] !== undefined) ? String(r[1]) : '');
}

// ── 画面全体の再描画 ────────────────────────────────
const PANEL_IDS = ['dashboard', 'daily', 'weekly', 'monthly'];
const SUB_IDS = ['general', 'katsudo', 'shodan'];

async function renderCurrentView() {
  const isTeam = !selectedMember;
  const sheet = currentSheet();
  const need = isTeam ? [SHEET_DASHBOARD, SHEET_REPORT, SHEET_ANALYSIS] : [sheet, SHEET_ANALYSIS];

  showStatus('読み込み中...', false);
  let sheets;
  try {
    sheets = await fetchSheets(need);
  } catch (e) {
    showStatus('データの読み込みに失敗しました：' + e.message, true);
    return;
  }

  PANEL_IDS.forEach(id => { document.getElementById('panel-' + id).innerHTML = ''; });
  SUB_IDS.forEach(id => { document.getElementById('sub-' + id).innerHTML = ''; });

  const own = parseSheet(sheets[sheet] || []);
  const analysis = parseSheet(sheets[SHEET_ANALYSIS] || []);

  // ダッシュボード：1係全体は「ダッシュボード」タブ、メンバーは本人タブの■1〜■5
  const dashRoot = document.getElementById('panel-dashboard');
  const dashSrc = isTeam ? parseSheet(sheets[SHEET_DASHBOARD] || []) : own;
  renderHero(dashRoot, dashSrc);
  dashSrc.sections.filter(s => isDashboardSection(s.title)).forEach(sec => renderSection(dashRoot, sec));

  // 日報・週報・月報：入力欄＋スプシ側で生成済みの報告文
  renderReportPanel('daily', sheet, own);
  renderReportPanel('weekly', sheet, own);
  renderReportPanel('monthly', sheet, own);

  // 分析：全般（1係のみ）／架電分析／商談分析
  renderAnalysisPanels(isTeam, own, analysis);

  applyTabVisibility(isTeam);
  PANEL_IDS.forEach(id => reveal(document.getElementById('panel-' + id)));
  SUB_IDS.forEach(id => reveal(document.getElementById('sub-' + id)));
  hideStatus();
}

function renderHero(root, parsed) {
  if (!parsed.title) return;
  const hero = document.createElement('div');
  hero.className = 'hero';
  const text = document.createElement('div');
  text.className = 'hero-text';
  const h = document.createElement('h2');
  h.textContent = parsed.title;
  text.appendChild(h);
  if (parsed.period) {
    const p = document.createElement('div');
    p.className = 'period';
    // 「／」区切りの期間表記を項目ごとに分けて折り返しやすくする
    parsed.period.split('／').forEach(part => {
      const span = document.createElement('span');
      span.textContent = part.trim();
      p.appendChild(span);
    });
    text.appendChild(p);
  }
  hero.appendChild(text);
  if (parsed.elapsedPct !== null) hero.appendChild(buildProgressRing(parsed.elapsedPct, '四半期 経過'));
  root.appendChild(hero);
}

// ダッシュボードタブに出すのは、手入力セル・報告文・行動分析(■6)以外の全セクション
function isDashboardSection(title) {
  if (title.startsWith('■ 手入力セル')) return false;
  if (title.startsWith('◆')) return false;
  if (/^■6\./.test(title)) return false; // メンバーの行動分析は分析タブへ回す
  return true;
}

// ── 日報・週報・月報パネル ──────────────────────────
const REPORT_LABEL = { daily: '日報', weekly: '週報', monthly: '月報' };

function renderReportPanel(group, sheet, parsed) {
  const root = document.getElementById('panel-' + group);
  const grp = inputGroupFor(sheet, group);
  const values = inputValuesFrom(parsed);
  const editable = canEditCurrent();

  if (grp) root.appendChild(buildInputCard(group, grp, values, editable));

  // スプシ側で生成済みの報告文（◆見出しの直下セル）
  const sec = findSection(parsed, t => t.startsWith('◆') && t.includes(REPORT_LABEL[group]));
  if (sec) {
    if (group === 'monthly') root.appendChild(buildMonthlyBlock(sec));
    else root.appendChild(buildReportTextCard(sec, REPORT_LABEL[group], parsed.title));
  }

  if (!grp && !sec) {
    root.innerHTML = `<div class="empty-note">この対象には${REPORT_LABEL[group]}のデータがありません。</div>`;
  }
}

function buildInputCard(group, grp, values, editable) {
  const card = document.createElement('div');
  card.className = 'input-card';

  const h = document.createElement('h2');
  h.textContent = `${REPORT_LABEL[group]}の入力`;
  card.appendChild(h);

  if (!editable) {
    const note = document.createElement('div');
    note.className = 'viewer-note';
    note.textContent = selectedMember
      ? `${selectedMember}さんの入力欄です（入力できるのは本人のみ）。閲覧のみ表示しています。`
      : '1係全体の入力欄です（入力できるのは増田係長のみ）。閲覧のみ表示しています。';
    card.appendChild(note);
  }

  const inputs = [];
  grp.picked.forEach(({ def, row }) => {
    const line = document.createElement('div');
    line.className = 'field-row';
    const label = document.createElement('label');
    label.textContent = def.label;
    line.appendChild(label);

    const input = def.type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
    if (def.type === 'number') input.type = 'text'; // 全角数字入力もそのまま許容するためtext扱い
    input.value = values[row - 4] || '';
    input.dataset.key = def.key;
    if (!editable) input.readOnly = true;
    line.appendChild(input);
    inputs.push(input);
    card.appendChild(line);
  });

  const msg = document.createElement('div');
  msg.className = 'save-msg';

  if (editable) {
    const saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.textContent = '保存';
    saveBtn.onclick = () => saveInputGroup(grp, inputs, saveBtn, msg);
    card.appendChild(saveBtn);
  }
  card.appendChild(msg);
  return card;
}

async function saveInputGroup(grp, inputs, saveBtn, msg) {
  msg.textContent = '';
  msg.className = 'save-msg';
  saveBtn.disabled = true;
  saveBtn.textContent = '保存中...';

  const values = inputs.map(inp => [inp.value]); // 失敗時もinputの値はそのまま残るので入力内容は失われない（REQ-05）

  try {
    const range = grp.range;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${accessToken}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ range, majorDimension: 'ROWS', values }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    msg.textContent = '保存しました';
    msg.className = 'save-msg ok';
    // 保存した内容が次の再描画で古いまま出ないよう、そのタブのキャッシュだけ捨てて読み直す
    delete sheetCache[currentSheet()];
    await renderCurrentView();
    activateTab(activeTab); // 再描画でパネルが差し替わるので、開いていたタブを開き直す
  } catch (e) {
    msg.textContent = '保存に失敗しました（入力内容は消えていません）：' + e.message;
    msg.className = 'save-msg error';
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '保存';
  }
}

// ◆見出しの直下にある長文セルを、崩さず等幅で見せてコピーできるようにする。
// この文面はスプシ側のスクリプト（平日16:55実行）が生成した「時点もの」で、
// 上の入力欄をここで保存しても即座には反映されない（次回のスクリプト実行まで変わらない）ため、その旨を明示する。
function buildReportTextCard(sec, label, titleLine) {
  const body = (sec.rows.find(r => r && r[0]) || [])[0] || '';
  const card = document.createElement('div');
  card.className = 'report-block';

  const h = document.createElement('h2');
  h.style.cssText = 'font-size:15px;margin:0 0 6px;font-weight:700;';
  h.textContent = `${label}（Slackへコピー）`;
  card.appendChild(h);

  const asOf = document.createElement('div');
  asOf.style.cssText = 'font-size:12px;color:var(--muted-2);margin-bottom:12px;';
  const m = String(titleLine || '').match(/更新[:：]\s*(.+)$/);
  asOf.textContent = m
    ? `${m[1]} 時点の内容です。上の入力欄を保存しても、この文面は次回の自動更新（平日16:55）まで変わりません。`
    : '上の入力欄を保存しても、この文面は次回の自動更新（平日16:55）まで変わりません。';
  card.appendChild(asOf);

  if (!String(body).trim()) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = 'まだ生成されていません（スプレッドシートの自動更新後に表示されます）。';
    card.appendChild(empty);
    return card;
  }

  const pre = document.createElement('pre');
  pre.textContent = body;
  card.appendChild(pre);

  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = 'コピー';
  btn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(body);
      btn.textContent = 'コピーしました';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1800);
    } catch (e) {
      // クリップボードが使えない環境では選択状態にして手動コピーに委ねる
      const range = document.createRange();
      range.selectNodeContents(pre);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      btn.textContent = '選択しました（Ctrl+Cでコピー）';
      setTimeout(() => { btn.textContent = 'コピー'; }, 2600);
    }
  };
  card.appendChild(btn);
  return card;
}

// 月報転記ブロック（指標／目標／結果／達成率／備考）は達成率をバーで見せる
function buildMonthlyBlock(sec) {
  const wrap = document.createElement('div');
  addTitle(wrap, '月報転記ブロック（パワポにこの順で転記）');
  const rows = dataRowsOf(sec);
  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = 'まだ生成されていません。';
    wrap.appendChild(empty);
    return wrap;
  }

  const header = rows[0] || [];
  const iRate = header.indexOf('達成率');
  const grid = document.createElement('div');
  grid.className = 'tile-grid';

  rows.slice(1).forEach(r => {
    const rate = iRate >= 0 ? pct(toPercentText(r[iRate])) : null;
    // 「不足の内訳」「行動変化」のような数値を持たない行はタイルにせず表に回す
    if (rate === null && !(r[1] || r[2])) return;
    const tile = document.createElement('div');
    tile.className = 'tile';

    const head = document.createElement('div');
    head.className = 'tile-head';
    const name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = r[0] || '';
    head.appendChild(name);
    if (rate !== null) {
      const status = document.createElement('span');
      const tone = rate >= 100 ? 'good' : rate >= 80 ? 'warning' : 'critical';
      status.className = 'tile-status ' + tone;
      status.textContent = `達成率 ${Math.round(rate)}%`;
      head.appendChild(status);
    }

    const val = document.createElement('div');
    val.className = 'tile-value';
    val.textContent = fmtNum(r[2]);
    if (r[1]) {
      const of = document.createElement('span');
      of.className = 'of';
      of.textContent = `/ ${fmtNum(r[1])}（目標）`;
      val.appendChild(of);
    }

    tile.append(head, val);
    if (rate !== null) tile.appendChild(makeBar(rate, toneColor(rate >= 100 ? 'good' : rate >= 80 ? 'warning' : 'critical')));
    if (r[4]) {
      const note = document.createElement('div');
      note.className = 'tile-note';
      note.textContent = r[4];
      tile.appendChild(note);
    }
    grid.appendChild(tile);
  });
  if (grid.children.length) wrap.appendChild(grid);

  // 数値にならない行（不足の内訳・行動変化など）は表としてそのまま残す
  const rest = rows.slice(1).filter(r => {
    const rate = iRate >= 0 ? pct(toPercentText(r[iRate])) : null;
    return rate === null && !(r[1] || r[2]);
  });
  if (rest.length) wrap.appendChild(buildTable([header].concat(rest)));
  return wrap;
}

// ── 分析パネル ────────────────────────────────────
function renderAnalysisPanels(isTeam, own, analysis) {
  const general = document.getElementById('sub-general');
  const katsudo = document.getElementById('sub-katsudo');
  const shodan = document.getElementById('sub-shodan');

  if (isTeam) {
    // 架電＝■3 活動相関、商談＝■6 商談分析、それ以外は全般へ
    analysis.sections.forEach(sec => {
      if (/^■3\./.test(sec.title)) return renderSection(katsudo, sec);
      if (/^■6\./.test(sec.title)) return renderShodanScores(shodan, sec, null);
      renderSection(general, sec);
    });
  } else {
    // メンバーは本人タブの■6（架電スタッツ）と、分析タブ■6を担当で絞った採点表
    const own6 = findSection(own, t => /^■6\./.test(t));
    if (own6) renderStatStrip(katsudo, own6);
    const sec6 = findSection(analysis, t => /^■6\./.test(t));
    if (sec6) renderShodanScores(shodan, sec6, selectedMember);
  }

  if (!katsudo.children.length) katsudo.innerHTML = '<div class="empty-note">架電分析のデータがありません。</div>';
  if (!shodan.children.length) shodan.innerHTML = '<div class="empty-note">商談分析のデータがありません。</div>';
}

// 1行だけの指標群（架電数／接続率／アポ獲得など）を小タイルで並べる。
// 「ヘッダー＋値1行」のときだけ有効で、複数行ある表（分析タブのデータ品質等）は表のまま出す。
function renderStatStrip(root, sec) {
  const rows = dataRowsOf(sec);
  if (rows.length !== 2) return renderGenericTable(root, sec);

  addTitle(root, sec.title);
  const header = rows[0], vals = rows[1];
  const strip = document.createElement('div');
  strip.className = 'stat-strip';
  header.forEach((k, i) => {
    if (!k) return;
    const item = document.createElement('div');
    item.className = 'stat-item';
    const kEl = document.createElement('div');
    kEl.className = 'k';
    kEl.textContent = k;
    const vEl = document.createElement('div');
    vEl.className = 'v';
    vEl.textContent = /率$/.test(k) ? toPercentText(vals[i]) : fmtNum(vals[i]);
    item.append(kEl, vEl);
    strip.appendChild(item);
  });
  root.appendChild(strip);
}

// 商談分析の採点表。担当が指定されたらその人の行だけに絞る
function renderShodanScores(root, sec, onlyMember) {
  addTitle(root, onlyMember ? `商談分析（${onlyMember}さん分）` : sec.title);
  const rows = dataRowsOf(sec);
  if (!rows.length) return;

  const header = rows[0] || [];
  const iOwner = header.indexOf('担当');
  const iRank = header.indexOf('ランク');
  const iTotal = header.findIndex(h => String(h).startsWith('合計'));

  let body = rows.slice(1);
  if (onlyMember && iOwner >= 0) {
    body = body.filter(r => String(r[iOwner] || '').includes(onlyMember));
  }
  if (!body.length) {
    root.appendChild(Object.assign(document.createElement('div'), {
      className: 'empty-note',
      textContent: onlyMember ? `${onlyMember}さんの採点済み商談はまだありません。` : '採点済みの商談がありません。',
    }));
    return;
  }

  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const table = document.createElement('table');

  const htr = document.createElement('tr');
  htr.className = 'header-row';
  header.forEach(h => {
    const td = document.createElement('td');
    td.textContent = h;
    htr.appendChild(td);
  });
  table.appendChild(htr);

  body.forEach(r => {
    const tr = document.createElement('tr');
    header.forEach((_, i) => {
      const td = document.createElement('td');
      if (i === iRank && r[i]) {
        const b = document.createElement('span');
        const rank = String(r[i]).trim().toUpperCase();
        b.className = 'rank-badge rank-' + (['A', 'B', 'C', 'D'].includes(rank) ? rank.toLowerCase() : 'c');
        b.textContent = r[i];
        td.appendChild(b);
      } else if (i === iTotal && r[i] !== undefined && r[i] !== '') {
        td.textContent = fmtNum(r[i]);
      } else {
        td.textContent = fmtCell(r[i]);
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });

  scroll.appendChild(table);
  root.appendChild(scroll);
}

function showStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  el.style.display = 'block';
}
function hideStatus() {
  document.getElementById('statusMsg').style.display = 'none';
}

// カード群は読み込み時に一括で動かすのではなく、スクロールして実際に画面へ入ってきた瞬間に浮き上がらせる
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    entry.target.classList.add('is-visible');
    revealObserver.unobserve(entry.target);
  });
}, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

function reveal(root) {
  const els = root.querySelectorAll('.hero, .tile, .funnel-card, .member-card, .action-item, .notice, .chart-card');
  els.forEach((el, i) => {
    el.classList.add('reveal-pending');
    el.style.transitionDelay = Math.min((i % 8) * 50, 300) + 'ms';
    revealObserver.observe(el);
  });
}

function renderSection(root, sec) {
  const t = sec.title;
  // Sheets側の埋め込みグラフへの案内行は、HTML側で実グラフを描くため不要
  if (t.startsWith('■ グラフ（')) return;

  // ── 1係全体（ダッシュボードタブ）の丸数字セクション ──
  if (t.startsWith('■①') && !t.startsWith("■①'")) return renderGoalTiles(root, sec);
  if (t.startsWith('■②')) return renderFunnel(root, sec);
  if (t.startsWith('■③')) return renderMemberCards(root, sec);
  if (t.startsWith('■④')) return renderActions(root, sec);
  if (t.startsWith('■⑤')) return renderNotice(root, sec);
  if (t.startsWith('■ グラフ用データ')) return renderCharts(root, sec);

  // ── メンバー個人タブ／分析タブの半角数字セクション ──
  if (/^■1\./.test(t)) return renderPeriodTargets(root, sec);   // 目標対比（メンバー）／セグメント別転換率（分析）
  if (/^■2\./.test(t)) return renderCompare(root, sec);         // 本人vs係平均（メンバー）／失注理由（分析）
  if (/^■3\./.test(t)) return renderPassedDeals(root, sec);     // パスした案件（メンバー）／活動相関（分析）
  if (/^■4\./.test(t)) return renderTrend(root, sec);           // 週次トレンド（メンバー）／滞留案件（分析）
  if (/^■5\./.test(t)) return renderStatStrip(root, sec);       // 先行在庫と必要自アポ（メンバー）／データ品質（分析）

  return renderGenericTable(root, sec);
}

// ── 表示用の小さなヘルパー ────────────────────────────
// Sheetsは「5/16」のような表記を日付として自動解釈してしまうことがある。
// APIからは日付シリアル値しか返らず元の表記は復元できないため、印だけ付けて気付けるようにする。
function looksLikeDateSerial(v) {
  const n = Number(v);
  return isFinite(n) && n > 40000 && n < 60000 && String(v).indexOf('/') < 0;
}
function markSuspect(v) {
  if (v === undefined || v === null) return '';
  return String(v);
}
// パス日・予定日など「本来日付の列」もシリアル値で降ってくる。表の中では読める日付に直す。
// （KPIの件数がこの範囲に入ることはないので、日付として解釈して差し支えない）
const SHEETS_EPOCH_UTC = Date.UTC(1899, 11, 30);
function serialToDateText(v) {
  const d = new Date(SHEETS_EPOCH_UTC + Number(v) * 86400000);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}
function fmtCell(v) {
  if (v === undefined || v === null) return '';
  return looksLikeDateSerial(v) ? serialToDateText(v) : String(v);
}
// 小数の余計な .0 を落とす。0.21 のような率はそのまま返す
function fmtNum(v) {
  if (v === undefined || v === null || v === '') return '';
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  return String(Math.round(n * 100) / 100);
}
// 0.21 → 21%、「21%」→「21%」に揃える
function toPercentText(v) {
  if (v === undefined || v === null || v === '') return '';
  const s = String(v);
  if (s.includes('%')) return s;
  const n = Number(v);
  if (!isFinite(n)) return s;
  return Math.round(n * 100) + '%';
}
// 「53/60」形式を{done,target,ratio}に。日付に化けた値・非数値はnull
function parseFraction(v) {
  const m = String(v == null ? '' : v).match(/^\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*$/);
  if (!m) return null;
  const done = Number(m[1]), target = Number(m[2]);
  return { done, target, ratio: target > 0 ? (done / target) * 100 : 0 };
}

// ■1：メンバーの「期間×指標」の目標対比（53/60形式）はタイル、
// それ以外（分析タブのセグメント別転換率など）は表で見せる
function renderPeriodTargets(root, sec) {
  const rows = dataRowsOf(sec);
  const hasFraction = rows.slice(1).some(r => r.slice(1).some(c => parseFraction(c)));
  if (!hasFraction) return renderGenericTable(root, sec);

  addTitle(root, sec.title);
  const header = rows[0] || [];
  const grid = document.createElement('div');
  grid.className = 'tile-grid';

  rows.slice(1).forEach(r => {
    header.slice(1).forEach((metric, idx) => {
      const cell = r[idx + 1];
      const fr = parseFraction(cell);
      const tile = document.createElement('div');
      tile.className = 'tile';

      const head = document.createElement('div');
      head.className = 'tile-head';
      const name = document.createElement('span');
      name.className = 'tile-name';
      name.textContent = `${r[0]}／${metric}`;
      head.appendChild(name);

      if (fr) {
        const tone = fr.ratio >= 100 ? 'good' : fr.ratio >= 80 ? 'warning' : 'critical';
        const status = document.createElement('span');
        status.className = 'tile-status ' + tone;
        status.textContent = `${Math.round(fr.ratio)}%`;
        head.appendChild(status);
      }

      const val = document.createElement('div');
      val.className = 'tile-value';
      if (fr) {
        const num = document.createElement('span');
        num.textContent = '0';
        val.appendChild(num);
        const of = document.createElement('span');
        of.className = 'of';
        of.textContent = `/ ${fmtNum(fr.target)}`;
        val.appendChild(of);
        animateCountUp(num, fr.done);
      } else if (looksLikeDateSerial(cell)) {
        // 日付に化けているのでそのまま出しつつ、要確認の印を付ける
        const bad = document.createElement('span');
        bad.className = 'suspect';
        bad.style.fontSize = '18px';
        bad.textContent = fmtNum(cell);
        bad.title = 'スプレッドシート側で日付に変換されてしまった値です（要確認）';
        val.appendChild(bad);
      } else {
        val.textContent = markSuspect(cell);
      }

      tile.append(head, val);
      if (fr) {
        const tone = fr.ratio >= 100 ? 'good' : fr.ratio >= 80 ? 'warning' : 'critical';
        tile.appendChild(makeBar(fr.ratio, toneColor(tone)));
      }
      grid.appendChild(tile);
    });
  });

  root.appendChild(grid);
}

// ■2：2行の比較（本人 vs 係平均）は並列バー、それ以外は表
function renderCompare(root, sec) {
  const rows = dataRowsOf(sec);
  // 先頭行の1列目が空＝ヘッダーが指標名の並びになっている比較表
  const isCompare = rows.length >= 3 && rows.slice(1, 3).every(r => r[0] && r.length > 2);
  if (!isCompare) return renderGenericTable(root, sec);

  addTitle(root, sec.title);
  const header = rows[0] || [];
  const labels = header.slice(1).map((h, i) => h || `指標${i + 1}`);
  // buildGroupedBarChartは[カテゴリ列名, 系列名...]を期待するので行列を入れ替える
  const seriesRows = rows.slice(1, 3);
  const chartHeader = ['指標'].concat(seriesRows.map(r => r[0]));
  const chartRows = labels.map((lab, i) => [lab].concat(seriesRows.map(r => {
    const n = Number(r[i + 1]);
    return isFinite(n) ? (n <= 1 ? n * 100 : n) : 0; // 0.21のような率は%に直して比較しやすくする
  })));
  root.appendChild(buildGroupedBarChart(chartHeader, chartRows));
  root.appendChild(buildTable(rows.slice(0, 3)));
  if (rows.length > 3) root.appendChild(buildTable(rows.slice(3)));
}

// ■3：メンバーは「パス後の件数ファネル＋案件一覧」、分析タブは週次の活動相関
function renderPassedDeals(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  if (!rows.length) return;

  // 数値だけの行が1本あればファネル、そうでなければ週次データとしてグラフ＋表
  const header = rows[0] || [];
  const numericRow = rows[1] && rows[1].every(c => c === '' || isFinite(Number(c))) ? rows[1] : null;

  if (numericRow && rows.length >= 2) {
    const card = document.createElement('div');
    card.className = 'funnel-card';
    const wrap = document.createElement('div');
    wrap.className = 'funnel';
    const vals = header.map((_, i) => Number(numericRow[i]) || 0);
    const maxV = Math.max(1, ...vals);
    header.forEach((label, i) => {
      if (!label) return;
      const step = document.createElement('div');
      step.className = 'funnel-step';
      step.innerHTML = '<div class="n"></div><div class="bar"></div><div class="l"></div>';
      step.querySelector('.n').textContent = fmtNum(numericRow[i]);
      step.querySelector('.bar').style.width = Math.max(20, (vals[i] / maxV) * 100) + '%';
      step.querySelector('.bar').style.margin = '8px auto 6px';
      step.querySelector('.l').textContent = label;
      wrap.appendChild(step);
    });
    card.appendChild(wrap);
    root.appendChild(card);
    if (rows.length > 2) root.appendChild(buildTable(rows.slice(2)));
    return;
  }

  // 週次の活動相関（週／架電数／アポ獲得／転換率）はグラフ＋表
  const chartRows = rows.slice(1)
    .filter(r => r[0])
    .map(r => [String(r[0]), Number(r[1]) || 0, Number(r[2]) || 0]);
  if (chartRows.length && header.length >= 3) {
    root.appendChild(buildGroupedBarChart([header[0], header[1], header[2]], chartRows));
  }
  root.appendChild(buildTable(rows));
}

// ■4：メンバーの週次トレンド（行＝系列・列＝週）は棒グラフ、それ以外は表
function renderTrend(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  if (!rows.length) return;

  const header = rows[0] || [];
  const series = rows.slice(1).filter(r => r[0]);
  // ヘッダーの2列目以降が週ラベルで、以降の行が系列になっている形
  const looksMatrix = series.length >= 1 && series.every(r => r.slice(1).every(c => c === '' || isFinite(Number(c))));
  if (looksMatrix && header.length > 2) {
    // 週を行に、系列を列に入れ替えてbuildGroupedBarChartに渡す
    const weeks = header.slice(1).map((h, i) => h || `週${i + 1}`);
    const chartHeader = ['週'].concat(series.map(r => r[0]));
    const chartRows = weeks.map((w, i) => [w].concat(series.map(r => Number(r[i + 1]) || 0)));
    root.appendChild(buildGroupedBarChart(chartHeader, chartRows));
    root.appendChild(buildTable(rows));
    return;
  }
  root.appendChild(buildTable(rows));
}

function addTitle(root, text) {
  const el = document.createElement('div');
  el.className = 'section-title';
  el.textContent = text;
  root.appendChild(el);
  return el;
}

function dataRowsOf(sec) { return sec.rows.filter(r => r && r.length); }

// ペース欄の絵文字から状態を判定する（色だけに意味を持たせず、絵文字＋文言もそのまま表示する）
function toneOf(text) {
  const s = String(text || '');
  if (s.includes('🔴')) return 'critical';
  if (s.includes('🟡')) return 'warning';
  if (s.includes('🟢')) return 'good';
  return '';
}
function toneColor(tone) {
  return tone === 'critical' ? 'var(--critical)'
       : tone === 'warning' ? 'var(--warning)'
       : tone === 'good' ? 'var(--good)'
       : 'var(--muted)';
}
function pct(v) {
  const n = parseFloat(String(v).replace('%', ''));
  return isFinite(n) ? n : null;
}
// 信号の意味は色付きドット＋背景色バッジ側で表現するので、テキスト側の絵文字は除いて読みやすくする
function stripEmoji(text) {
  return String(text || '').replace(/[🔴🟡🟢⚠️⚠]\s*/g, '').trim();
}
// ヒーロー用の円形プログレスリング（純SVG・外部ライブラリなし）
function buildProgressRing(percent, label) {
  const size = 76, stroke = 8, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(100, percent)) / 100);
  const wrap = document.createElement('div');
  wrap.className = 'hero-ring';
  wrap.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#fff" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="${size/2}" y="${size/2 + 6}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">${percent}%</text>
    </svg>
    <div class="ring-label"></div>`;
  wrap.querySelector('.ring-label').textContent = label;
  return wrap;
}

// 見た目が動くべき箇所（数字・バー）をまとめて動かすヘルパー。reduced-motion環境では即時に確定値を反映する
const prefersReducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateFillIn(el, prop, targetPercent) {
  const clamped = Math.max(0, Math.min(100, targetPercent));
  if (prefersReducedMotion()) { el.style[prop] = clamped + '%'; return; }
  el.style[prop] = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style[prop] = clamped + '%'; }));
}
function animateCountUp(el, target) {
  if (prefersReducedMotion() || !isFinite(target)) { el.textContent = target; return; }
  const duration = 900;
  const start = performance.now();
  (function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(tick);
  })(start);
}

function makeBar(ratio, color) {
  const track = document.createElement('div');
  track.className = 'bar-track';
  const fill = document.createElement('div');
  fill.className = 'bar-fill';
  fill.style.width = '0%';
  fill.style.background = color;
  track.appendChild(fill);
  animateFillIn(fill, 'width', ratio);
  return track;
}

// 「位置」：実績とMUSTを同じ線の上の点で示す。塗り面（量）ではなく点の位置（差）が主題。
// ratio=0〜100で実績の位置を置き、mustRatio（通常100）にMUSTの目印を置く。behindなら実績側を危険色に。
function buildPositionTrack(ratio, resultLabel, mustLabel, color, behind) {
  const track = document.createElement('div');
  track.className = 'pos-track';
  const fill = document.createElement('div');
  fill.className = 'pos-fill';
  fill.style.width = '0%';
  fill.style.background = color;
  track.appendChild(fill);
  if (mustLabel !== null) {
    const tick = document.createElement('div');
    tick.className = 'pos-tick';
    tick.style.left = '100%';
    tick.dataset.label = mustLabel;
    track.appendChild(tick);
  }
  const dot = document.createElement('div');
  dot.className = 'pos-dot';
  dot.style.left = '0%';
  dot.style.background = color;
  dot.dataset.label = resultLabel;
  track.appendChild(dot);
  animateFillIn(fill, 'width', ratio);
  animateFillIn(dot, 'left', ratio);
  return track;
}

// ■① ゴールとのギャップ → 指標ごとの大きな数字＋「位置」表示
function renderGoalTiles(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  const header = rows[0] || [];
  const col = name => header.indexOf(name);
  const iResult = col('実績'), iMust = col('MUST'), iRate = col('達成率');
  const iPace = col('ペース'), iLand = col('着地見込み'), iDiff = col('過不足'), iNote = col('補足');

  const grid = document.createElement('div');
  grid.className = 'tile-grid';

  rows.slice(1).forEach(r => {
    const tone = toneOf(r[iPace]);
    const rate = pct(r[iRate]);
    const tile = document.createElement('div');
    tile.className = 'tile';

    const head = document.createElement('div');
    head.className = 'tile-head';
    const name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = r[0];
    const status = document.createElement('span');
    status.className = 'tile-status ' + tone;
    status.textContent = stripEmoji(r[iPace]);
    head.append(name, status);

    const val = document.createElement('div');
    val.className = 'tile-value';
    const resultText = String(r[iResult] || '');
    const numSpan = document.createElement('span');
    const isPureNumber = /^\d+$/.test(resultText.trim());
    numSpan.textContent = isPureNumber ? '0' : resultText;
    val.appendChild(numSpan);
    if (iMust >= 0 && r[iMust]) {
      const of = document.createElement('span');
      of.className = 'of';
      of.textContent = `/ ${r[iMust]}（MUST）`;
      val.appendChild(of);
    }
    if (isPureNumber) animateCountUp(numSpan, Number(resultText.trim()));

    tile.append(head, val);
    if (rate !== null) {
      const behind = iDiff >= 0 && String(r[iDiff]).trim().startsWith('-');
      tile.appendChild(buildPositionTrack(rate, r[iResult], iMust >= 0 ? r[iMust] : null, toneColor(tone), behind));
    }

    const meta = document.createElement('div');
    meta.className = 'tile-meta';
    if (rate !== null) {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = `達成率 ${r[iRate]}`;
      meta.appendChild(s);
    }
    if (iDiff >= 0 && r[iDiff]) {
      const s = document.createElement('span');
      const behind = String(r[iDiff]).trim().startsWith('-');
      s.className = 'chip ' + (behind ? 'delta-behind' : 'delta-ahead');
      s.textContent = r[iDiff];
      meta.appendChild(s);
    }
    if (iLand >= 0 && r[iLand]) {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = `着地見込み ${r[iLand]}`;
      meta.appendChild(s);
    }
    tile.appendChild(meta);

    if (iNote >= 0 && r[iNote]) {
      const note = document.createElement('div');
      note.className = 'tile-note';
      note.textContent = r[iNote];
      tile.appendChild(note);
    }
    grid.appendChild(tile);
  });

  root.appendChild(grid);
}

// ■② ファネル → 件数と転換率を横並びで。パイプライン在庫行はそのまま表で残す
function renderFunnel(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  const header = rows[0] || [];
  const values = rows[1] || [];

  if (header.length && values.length) {
    const card = document.createElement('div');
    card.className = 'funnel-card';
    const wrap = document.createElement('div');
    wrap.className = 'funnel';
    // 段階の件数（偶数インデックス）の最大値を基準に、各段階のバー幅を件数に比例させる（漏斗の見た目）
    const stepVals = header.map((_, idx) => idx % 2 === 0 ? Number(values[idx]) || 0 : null).filter(v => v !== null);
    const maxStep = Math.max(1, ...stepVals);
    header.forEach((label, idx) => {
      const el = document.createElement('div');
      if (idx % 2 === 0) {
        const v = Number(values[idx]) || 0;
        el.className = 'funnel-step';
        el.innerHTML = `<div class="n"></div><div class="bar"></div><div class="l"></div>`;
        el.querySelector('.n').textContent = values[idx] ?? '';
        el.querySelector('.bar').style.width = Math.max(20, (v / maxStep) * 100) + '%';
        el.querySelector('.bar').style.margin = '8px auto 6px';
        el.querySelector('.l').textContent = label;
      } else {
        el.className = 'funnel-arrow';
        el.innerHTML = `<span class="rate"></span><span class="arrow-ico">→</span>`;
        el.querySelector('.rate').textContent = values[idx] ?? '';
        el.title = label;
      }
      wrap.appendChild(el);
    });
    card.appendChild(wrap);
    root.appendChild(card);
  }

  const rest = rows.slice(2);
  if (rest.length) root.appendChild(buildTable(rest));
}

// ■③ メンバー別ペース → 1人1カード。実績/目標を進捗バーで
function renderMemberCards(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  const header = rows[0] || [];
  const members = header.slice(1);
  const byLabel = {};
  rows.slice(1).forEach(r => { byLabel[r[0]] = r.slice(1); });

  // 同格を水平線で揃える：全員を1本の基準線の上に並べる（識学の組織図の作法）
  const strip = document.createElement('div');
  strip.className = 'rank-strip';
  members.forEach((m, mi) => {
    const paceText = (byLabel['ペース'] || [])[mi] || '';
    const tone = toneOf(paceText) || 'good';
    const node = document.createElement('span');
    node.className = 'rank-node';
    node.textContent = m.charAt(0);
    node.style.background = toneColor(tone);
    node.dataset.label = m;
    strip.appendChild(node);
  });
  root.appendChild(strip);

  const grid = document.createElement('div');
  grid.className = 'member-grid';

  members.forEach((m, mi) => {
    const card = document.createElement('div');
    card.className = 'member-card';

    const paceText = (byLabel['ペース'] || [])[mi] || '';
    const tone = toneOf(paceText) || 'good';
    const head = document.createElement('div');
    head.className = 'member-head';
    const avatar = document.createElement('span');
    avatar.className = 'member-avatar';
    avatar.textContent = m.charAt(0);
    avatar.style.background = toneColor(tone);
    const nameEl = document.createElement('span');
    nameEl.className = 'member-name';
    nameEl.textContent = m;
    const paceEl = document.createElement('span');
    paceEl.className = 'member-pace ' + tone;
    paceEl.textContent = stripEmoji(paceText);
    head.append(avatar, nameEl, paceEl);
    card.appendChild(head);

    // 「実績 / 目標」形式の行だけ進捗バーにする。
    // 「今週 商談/P2」のように見出し自体が "/" を含む行は別々の2指標を並べたものなので除外する。
    const isProgressRow = (label, cell) =>
      !label.includes('/') && /^\s*\d+\s*\/\s*\d+\s*$/.test(cell);

    Object.keys(byLabel).forEach(label => {
      if (label === 'ペース') return;
      const cell = String(byLabel[label][mi] ?? '');
      if (!isProgressRow(label, cell)) return;
      const m2 = cell.match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/);
      const [, doneStr, targetStr] = m2;
      const done = Number(doneStr), target = Number(targetStr);
      const ratio = target > 0 ? (done / target) * 100 : 0;

      const line = document.createElement('div');
      line.className = 'metric-line';
      const row = document.createElement('div');
      row.className = 'row';
      const l = document.createElement('span');
      l.textContent = label;
      const v = document.createElement('span');
      v.innerHTML = `<b></b> / ${target}`;
      animateCountUp(v.querySelector('b'), done);
      row.append(l, v);
      line.appendChild(row);
      line.appendChild(makeBar(ratio, toneColor(toneOf(paceText)) ));
      card.appendChild(line);
    });

    // 残りの自由書式の行はカード下部にまとめる
    const foot = document.createElement('div');
    foot.className = 'member-foot';
    let hasFoot = false;
    Object.keys(byLabel).forEach(label => {
      if (label === 'ペース') return;
      const cell = String(byLabel[label][mi] ?? '');
      if (isProgressRow(label, cell)) return; // 上で進捗バーにした行は重複表示しない
      const s = document.createElement('span');
      s.innerHTML = `${label} <b></b>`;
      s.querySelector('b').textContent = cell;
      foot.appendChild(s);
      hasFoot = true;
    });
    if (hasFoot) card.appendChild(foot);

    grid.appendChild(card);
  });

  root.appendChild(grid);
}

// ■④ 今週のアクション → 重要度で色分けしたリスト（絵文字はドット付きアイコンバッジに置き換える）
function renderActions(root, sec) {
  addTitle(root, sec.title);
  const list = document.createElement('div');
  list.className = 'action-list';
  dataRowsOf(sec).forEach(r => {
    // 先頭が連番のみの列なら本文は2列目
    const text = (r.length > 1 && /^\d+$/.test(String(r[0]).trim())) ? r.slice(1).join(' ') : r.join(' ');
    const tone = toneOf(text) || 'good';
    const item = document.createElement('div');
    item.className = 'action-item ' + tone;
    const ico = document.createElement('span');
    ico.className = 'action-ico';
    const body = document.createElement('span');
    body.className = 'action-text';
    body.textContent = stripEmoji(text);
    item.append(ico, body);
    list.appendChild(item);
  });
  root.appendChild(list);
}

// ■⑤ データ品質サマリー → 注意バナー
function renderNotice(root, sec) {
  addTitle(root, sec.title);
  dataRowsOf(sec).forEach(r => {
    const el = document.createElement('div');
    el.className = 'notice';
    const ico = document.createElement('span');
    ico.className = 'action-ico warning';
    const body = document.createElement('span');
    body.textContent = stripEmoji(r.join(' '));
    el.append(ico, body);
    root.appendChild(el);
  });
}

// ■ グラフ用データ → 空行区切りのグループごとに棒グラフ化
function renderCharts(root, sec) {
  addTitle(root, '■⑥ グラフ');
  let group = [];
  const flush = () => {
    if (group.length >= 2) root.appendChild(buildGroupedBarChart(group[0], group.slice(1)));
    group = [];
  };
  sec.rows.forEach(r => {
    if (!r || !r.length) { flush(); return; }
    group.push(r);
  });
  flush();
}

function renderGenericTable(root, sec) {
  addTitle(root, sec.title);
  const rows = dataRowsOf(sec);
  if (rows.length) root.appendChild(buildTable(rows));
}

function buildTable(rows) {
  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const table = document.createElement('table');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    const looksLikeHeader = row.every(cell => !/[0-9]/.test(String(cell)));
    if (looksLikeHeader) tr.className = 'header-row';
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = fmtCell(cell); // 日付シリアル値は読める日付に直す
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  scroll.appendChild(table);
  return scroll;
}

function escapeXml(s) {
  return String(s).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));
}

// header: ['ステージ','件数'] のような [カテゴリ列名, 系列名...]。rows: [カテゴリ, 値...][]
// 系列色はdataviz skillのカテゴリカルパレット固定順（暗背景用、slot1〜8）を使用。9系列目以降は想定外としてグレーにフォールバックする
const SERIES_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
function seriesColor(i) { return SERIES_COLORS[i] || '#8a8e9c'; }
function buildGroupedBarChart(header, dataRows) {
  const seriesNames = header.slice(1);
  const categories = dataRows.map(r => r[0]);
  const seriesData = seriesNames.map((_, si) => dataRows.map(r => Number(r[si + 1]) || 0));
  const maxVal = Math.max(1, ...seriesData.flat());

  const width = 640, plotHeight = 140, catGap = 14;
  const groupWidth = (width - catGap * (categories.length + 1)) / categories.length;
  const barGap = seriesNames.length > 1 ? 3 : 0;
  const barWidth = Math.min(32, (groupWidth - barGap * (seriesNames.length - 1)) / seriesNames.length);

  let svg = `<svg viewBox="0 0 ${width} ${plotHeight + 24}" width="100%" style="max-width:${width}px;display:block;">`;
  // 目盛りの補助線（0%・50%・100%）
  [0.25, 0.5, 0.75].forEach(f => {
    const y = plotHeight - (plotHeight - 20) * f;
    svg += `<line x1="0" y1="${y.toFixed(1)}" x2="${width}" y2="${y.toFixed(1)}" class="chart-gridline"/>`;
  });
  svg += `<line x1="0" y1="${plotHeight}" x2="${width}" y2="${plotHeight}" stroke="rgba(255,255,255,.28)" stroke-width="1"/>`;

  categories.forEach((cat, ci) => {
    const groupX = catGap + ci * (groupWidth + catGap);
    seriesNames.forEach((name, si) => {
      const val = seriesData[si][ci];
      const h = maxVal ? (val / maxVal) * (plotHeight - 20) : 0;
      const x = groupX + si * (barWidth + barGap);
      const y = plotHeight - h;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${seriesColor(si)}"><title>${escapeXml(name)} ${escapeXml(cat)}: ${val}</title></rect>`;
      svg += `<text class="chart-value-label" x="${(x + barWidth / 2).toFixed(1)}" y="${Math.max(10, y - 4).toFixed(1)}" text-anchor="middle">${val}</text>`;
    });
    svg += `<text class="chart-bar-label" x="${(groupX + groupWidth / 2).toFixed(1)}" y="${plotHeight + 16}" text-anchor="middle">${escapeXml(cat)}</text>`;
  });
  svg += `</svg>`;

  const card = document.createElement('div');
  card.className = 'chart-card';
  if (seriesNames.length > 1) {
    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    legend.innerHTML = seriesNames.map((name, i) =>
      `<span><span class="swatch" style="background:${seriesColor(i)}"></span>${escapeXml(name)}</span>`
    ).join('');
    card.appendChild(legend);
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = svg;
  card.appendChild(wrap.firstChild);
  return card;
}
